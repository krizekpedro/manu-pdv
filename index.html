</script>
<style>
/* =========================================================
   VARIÁVEIS E BASE
   ========================================================= */
:root{
  --bg:#fbf5f6;
  --panel:#ffffff;
  --ink:#3a2a2f;
  --ink-2:#5b4349;
  --muted:#957a80;
  --line:#f0e1e4;
  --primary:#d4718c;
  --primary-dark:#b5546f;
  --primary-soft:#fbe8ed;
  --gold:#b9846c;
  --gold-dark:#9a6a55;
  --gold-soft:#f7ebe4;
  --gold-grad:linear-gradient(90deg,#c99a83,#e8c3b0 45%,#b9846c);
  --rose-grad:linear-gradient(135deg,#e08ea4,#d4718c 55%,#c2847a);
  --dark:#3a2a2f;
  --dark-2:#4a363c;
  --serif:"Cinzel","Trajan Pro","Georgia","Times New Roman",serif;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --amber:#d97706;
  --amber-soft:#fef3c7;
  --blue:#2563eb;
  --blue-soft:#dbeafe;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --mono:"Consolas","SFMono-Regular","Menlo","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none !important}
.mode{height:100vh;width:100vw}

/* Botões genéricos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;background:#fdf6f7;color:var(--ink-2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--primary-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--rose-grad);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger:hover{background:#b91c1c}
.btn-outline-danger{background:#fff;color:var(--red);border-color:#fecaca}
.btn-outline-danger:hover{background:var(--red-soft)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.cat-table td{padding:6px 8px;vertical-align:middle}.cat-table .icon-btn[disabled]{opacity:.25;cursor:default}.cat-del td{background:#fff5f6}
.btn-lg{padding:14px 22px;font-size:17px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:#f1f5f9;border:1px solid var(--line);font-size:15px}
.icon-btn:hover{background:#e2e8f0}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-group{display:flex;gap:8px}
.input-group .input{flex:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.hint{font-size:12px;color:var(--muted)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.b-green{background:var(--green-soft);color:#166534}
.b-red{background:var(--red-soft);color:#991b1b}
.b-amber{background:var(--amber-soft);color:#92400e}
.b-blue{background:var(--blue-soft);color:#1e40af}
.b-gray{background:#f1f5f9;color:#475569}
.b-pink{background:var(--primary-soft);color:var(--primary-dark)}

/* =========================================================
   MODO 1 — FRENTE DE CAIXA
   ========================================================= */
#pdv{display:grid;grid-template-rows:64px 1fr auto}
.pdv-header{background:#fff;color:var(--ink);display:flex;align-items:center;gap:18px;padding:0 20px;position:relative;box-shadow:0 2px 12px rgba(185,132,108,.12)}
.pdv-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold-grad)}
.brand-logo{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo img.crown{height:34px;width:auto}
.brand-text{line-height:1}
.brand-text .bt-name{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:2px;background:linear-gradient(180deg,#e597ab,#c9637f);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text .bt-sub{font-size:9.5px;letter-spacing:3.2px;color:var(--gold);font-weight:600;margin-top:3px;text-transform:uppercase;white-space:nowrap}
.brand-meta{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;line-height:1.35}
.heart-div{display:flex;align-items:center;gap:10px;color:var(--gold)}
.heart-div::before,.heart-div::after{content:"";flex:1;height:1.5px;background:var(--gold-grad)}
.heart-div span{font-size:15px;line-height:1}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.store-name{font-weight:800;font-size:18px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent}
.pill.open{background:var(--green-soft);color:#15803d;border-color:#bbf7d0}
.pill.closed{background:var(--red-soft);color:#b91c1c;border-color:#fecaca}
.header-spacer{flex:1}
.clock{text-align:right;line-height:1.15}
.clock #clockTime{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink)}
.clock #clockDate{font-size:12px;color:var(--muted);text-transform:capitalize}
.btn-admin{padding:9px 14px;border-radius:10px;color:var(--gold-dark);border:1.5px solid #e6cfc3;font-size:14px;font-weight:600;background:#fff}
.btn-cloud{font-size:13px;padding:8px 12px}
.btn-cloud.ok{color:#15803d;border-color:#bbf7d0;background:var(--green-soft)}
.btn-cloud.offline,.btn-cloud.pending{color:#92400e;border-color:#fde68a;background:var(--amber-soft)}
.btn-cloud.error{color:#b91c1c;border-color:#fecaca;background:var(--red-soft)}
.sql-box{background:#2d2226;color:#fde8ee;font-family:var(--mono);font-size:12.5px;border-radius:10px;padding:12px;white-space:pre;overflow-x:auto;margin:8px 0}
.steps{padding-left:20px;line-height:1.65;font-size:14px}
.steps li{margin-bottom:8px}
details.guide summary{cursor:pointer;font-weight:700;color:var(--primary-dark);padding:8px 0}
.btn-backup{color:var(--primary-dark);border-color:var(--primary);background:var(--primary-soft);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,113,140,.45)}50%{box-shadow:0 0 0 6px rgba(212,113,140,0)}}
.btn-admin:hover{background:var(--gold-soft);border-color:var(--gold)}

.pdv-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px;min-height:0}

/* Cupom */
.cupom{background:#fffef8;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;border:1px solid #efe9d6;overflow:hidden}
.cupom-head{padding:14px 18px;border-bottom:2px dashed #d6d0bd;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cupom-head .t{font-family:var(--serif);font-weight:700;letter-spacing:2px;font-size:16px;color:var(--primary-dark)}
.cupom-head .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cupom-cols,.item-row{display:grid;grid-template-columns:42px minmax(0,1fr) 118px 110px 98px 36px;align-items:center;gap:8px}
.cupom-cols{padding:8px 18px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid #eee7d2}
.cupom-cols .r,.item-row .r{text-align:right}
.cupom-list{flex:1;overflow-y:auto;padding:4px 10px}
.item-row{padding:9px 8px;border-bottom:1px dotted #e3dcc6;font-family:var(--mono);font-size:14px;border-radius:8px}
.item-row:hover{background:#fbf6e6}
.item-row.flash{animation:flash 1s ease}
@keyframes flash{0%{background:#fde68a}100%{background:transparent}}
.item-row .n{color:var(--muted);font-size:12px}
.item-row .name{font-family:"Montserrat","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row .code{font-size:11px;color:var(--muted)}
.qtyctl{display:flex;align-items:center;gap:4px;justify-content:center}
.qtyctl button{width:26px;height:26px;border-radius:6px;background:#f3eedd;font-weight:800;font-size:15px}
.qtyctl button:hover{background:#e9e1c6}
.qtyctl .q{min-width:32px;text-align:center;font-weight:800;cursor:pointer;padding:3px 4px;border-radius:6px}
.qtyctl .q:hover{background:#fff3c4}
.item-row .unit{font-size:13px;color:var(--ink-2)}
.item-row .sub{font-weight:800}
.item-row .del{width:30px;height:30px;border-radius:8px;color:var(--red);font-size:15px}
.item-row .del:hover{background:var(--red-soft)}
.cupom-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:30px}
.cupom-empty .big{font-size:56px;opacity:.6}
.cupom-empty .t1{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--primary);letter-spacing:3px}
.cupom-empty img{width:150px;opacity:.9}
.cupom-empty .heart-div{width:220px}
.cupom-foot{border-top:2px dashed #d6d0bd;padding:12px 18px;font-family:var(--mono);font-size:14px;display:grid;gap:4px}
.cupom-foot .line{display:flex;justify-content:space-between}
.cupom-foot .disc{color:var(--red)}
.cupom-foot .vale{color:var(--blue)}

/* Coluna operação */
.ops{display:flex;flex-direction:column;gap:16px;min-height:0}
.search-wrap{position:relative;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.search-wrap label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.search-box{display:flex;align-items:center;gap:10px;border:2px solid var(--primary);border-radius:12px;padding:0 14px;background:#fff;box-shadow:0 0 0 4px var(--primary-soft)}
.search-box span{font-size:22px}
#searchInput{flex:1;border:none;outline:none;font-size:24px;padding:14px 0;font-weight:600;min-width:0;background:transparent}
.suggestions{position:absolute;left:16px;right:16px;top:calc(100% - 8px);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.22);border:1px solid var(--line);z-index:50;max-height:360px;overflow-y:auto}
.sug{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.sug:last-child{border-bottom:none}
.sug.active,.sug:hover{background:var(--primary-soft)}
.sug .em{font-size:26px;width:36px;text-align:center}
.sug .info{flex:1;min-width:0}
.sug .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .meta{font-size:12px;color:var(--muted)}
.sug .pr{font-weight:800;color:var(--primary-dark);white-space:nowrap}
.sug-empty{padding:14px;color:var(--muted);text-align:center}

.last-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;gap:18px;align-items:center;flex:1;min-height:150px}
.last-card .photo{overflow:hidden;width:120px;height:120px;border-radius:16px;background:linear-gradient(135deg,var(--primary-soft),var(--gold-soft));display:flex;align-items:center;justify-content:center;font-size:68px;flex-shrink:0}
.last-card .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.last-card .nm{font-size:25px;font-weight:700;line-height:1.15;margin:6px 0 8px}
.last-card .price{font-size:30px;font-weight:800;color:var(--primary-dark);font-family:var(--mono)}
.last-card .stock{font-size:14px;color:var(--ink-2);margin-top:6px}
.last-card.empty{justify-content:center;color:var(--muted);text-align:center;flex-direction:column;gap:6px}
.last-card.empty .photo{background:#f1f5f9;opacity:.7}

.total-display{background:var(--rose-grad);border-radius:var(--radius);padding:18px 22px;color:#fff;box-shadow:0 8px 24px rgba(212,113,140,.3);position:relative;overflow:hidden}
.total-display::before{content:"♛";position:absolute;left:18px;bottom:-26px;font-size:120px;opacity:.12;line-height:1}
.total-display .lbl{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:3px;color:#fff6f8}
.total-display .val{font-family:var(--mono);font-size:clamp(44px,6vw,76px);font-weight:800;color:#fff;text-align:right;line-height:1.1;text-shadow:0 2px 12px rgba(120,40,60,.25);position:relative}
.total-display .info{display:flex;justify-content:space-between;color:#fde8ee;font-size:13px;margin-top:4px;gap:10px;flex-wrap:wrap}

/* Rodapé atalhos */
.pdv-footer{background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(185,132,108,.1);padding:10px 16px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.fkey{background:#fff;color:var(--ink-2);border:1.5px solid #ecd9dd;border-radius:12px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:14px;transition:.15s;min-height:54px}
.fkey:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
.fkey kbd{background:var(--gold-soft);color:var(--gold-dark);font-family:var(--mono);font-weight:800;padding:4px 8px;border-radius:6px;font-size:13px;box-shadow:0 2px 0 #e2c6b8}
.fkey.danger:hover{background:var(--red-soft);border-color:#fca5a5;color:var(--red)}
.fkey.finish{background:var(--rose-grad);border-color:var(--primary);color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px}
.fkey.finish:hover{filter:brightness(.95);color:#fff;background:var(--rose-grad)}
.fkey.finish kbd{background:#fff;color:var(--primary-dark);box-shadow:none}

/* =========================================================
   MODO 2 — ADMINISTRATIVO
   ========================================================= */
#admin{display:grid;grid-template-columns:240px 1fr}
.sidebar{background:#fff;color:var(--ink-2);border-right:1px solid var(--line);box-shadow:2px 0 12px rgba(185,132,108,.08);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.side-logo{padding:4px 6px 6px;text-align:center}
.side-logo img{width:100%;max-width:190px}
.side-logo .heart-div{margin:2px 10px 14px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:600;text-align:left;color:var(--ink-2);width:100%}
.nav-btn:hover{background:var(--primary-soft);color:var(--primary-dark)}
.nav-btn.active{background:var(--rose-grad);color:#fff;box-shadow:0 4px 12px rgba(212,113,140,.3)}
.nav-btn .ic{font-size:18px;width:22px;text-align:center}
.sidebar .grow{flex:1}
.user-box{border-top:1px solid var(--line);padding:12px 8px 4px;font-size:13px;display:flex;align-items:center;gap:10px}
.user-box .av{width:34px;height:34px;border-radius:50%;background:var(--rose-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.user-box .nm{font-weight:700;color:var(--ink)}
.user-box a{color:var(--primary-dark);cursor:pointer;font-weight:600;text-decoration:underline}
.perm-list{display:grid;gap:8px;margin-top:6px}
.perm-list label{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.perm-list input{width:18px;height:18px;accent-color:var(--primary)}
.cust-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #efc4cf;background:var(--primary-soft);border-radius:10px;flex-wrap:wrap}
.cw-res{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.cw-res:empty{display:none}
.cw-new{margin-top:10px;padding:12px;border:1.5px dashed #efc4cf;border-radius:10px;background:#fffafb}
.cupom-cust{font-size:12px;color:var(--primary-dark);font-weight:700;cursor:pointer;margin-top:3px}
.cupom-cust:hover{text-decoration:underline}
.date-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.date-card .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.date-card .dn{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--primary-dark)}
.cust-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.cust-row .info{flex:1;min-width:200px}
.wa{display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.wa:hover{background:#1ebe5b}
.pimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.sug .em .pimg{width:36px;height:36px;border-radius:8px}
.thumb{width:42px;height:42px;border-radius:8px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.gift-opt .ic .pimg{width:56px;height:56px;border-radius:10px}
.photo-box{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.photo-box .pv{width:110px;height:110px;border-radius:14px;background:linear-gradient(135deg,var(--primary-soft),var(--gold-soft));display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--primary-soft);border:1px solid #efc4cf}
.bulk-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.bulk-row .bulk-in{flex:1;min-width:220px}
td.ck,th.ck{width:34px;text-align:center}
td.ck input,th.ck input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
tr.sel td{background:#fff5f8}
.btn-back{background:var(--gold-grad);color:#fff;text-shadow:0 1px 2px rgba(120,70,50,.35);padding:13px 14px;border-radius:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn-back:hover{filter:brightness(.95)}
.admin-content{overflow-y:auto;padding:24px 28px 40px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--primary-dark);letter-spacing:.5px}
.page-head p{color:var(--muted);margin-top:2px}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--primary-soft);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border-left:5px solid var(--primary)}
.kpi .k-l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .k-v{font-size:24px;font-weight:800;margin-top:6px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.green{border-color:var(--gold)} .kpi.blue{border-color:#e8a9b9} .kpi.amber{border-color:#d9b3a0} .kpi.red{border-color:var(--red)}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-box{position:relative;height:280px}
.chart-msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input,.toolbar .select{width:auto}
.toolbar .search{flex:1;min-width:220px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td.mono{font-family:var(--mono)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.empty-row{text-align:center;color:var(--muted);padding:30px}
.alert-list{display:grid;gap:8px}
.alert-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa}
.alert-item.zero{background:var(--red-soft);border-color:#fecaca}
.alert-item .em{font-size:24px}
.alert-item .info{flex:1}
.alert-item .nm{font-weight:700}
.alert-item .meta{font-size:12px;color:var(--muted)}
.cash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:800;font-family:var(--mono);margin-top:4px}
.stat.hl{background:var(--green-soft);border-color:#bbf7d0}
.stat.hl .v{color:#166534}
.stat.bad{background:var(--red-soft);border-color:#fecaca}.stat.bad .v{color:#991b1b}
.stat .hint{margin-top:2px}
.fin-banner{display:flex;gap:16px;align-items:center;border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.fin-banner.ok{background:linear-gradient(135deg,#ecfdf5,#dcfce7);border:1px solid #bbf7d0;color:#14532d}
.fin-banner.bad{background:linear-gradient(135deg,#fff1f2,#fee2e2);border:1px solid #fecaca;color:#7f1d1d}
.fin-banner .ic{font-size:40px}.fin-banner .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
.fin-banner .v{font-size:26px;font-weight:800;margin:2px 0}.fin-banner .s{font-size:14px}
table.dre td{padding:7px 8px}table.dre tr.neg td:first-child{padding-left:20px;color:var(--ink-2)}
table.dre tr.sub td{font-weight:700;border-top:1px solid var(--line);background:#fdf7f8}
table.dre tr.total td{font-weight:800;font-size:16px;border-top:2px solid var(--ink-2)}
table.dre tr.total.ok td{color:#166534;background:#f0fdf4}table.dre tr.total.bad td{color:#991b1b;background:#fef2f2}
.kpis.fin .k-v{font-size:20px}
.fin-ind{display:grid;gap:16px}.fin-ind .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.fin-ind .v{font-size:22px;font-weight:800;font-family:var(--mono)}.fin-ind .v.pos{color:#166534}.fin-ind .v.negv{color:#991b1b}
.progress{height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-top:6px}.progress div{height:100%;border-radius:6px}
tr.row-late td{background:#fff7f7}
.fee-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 12px}
.pu-res{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:280px;overflow:auto}
.pu-res button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}.pu-res button:hover{background:var(--primary-soft)}
.pu-items td{padding:6px 8px;vertical-align:middle}
.pu-total{font-size:22px;font-weight:800;padding:8px 0;color:var(--primary-dark)}
@media (max-width:900px){.fee-grid{grid-template-columns:repeat(3,1fr)}}
.danger-zone{border:1.5px dashed #fecaca;background:#fffafa}

/* =========================================================
   MODAL / TOAST
   ========================================================= */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .15s ease}
.modal.lg{max-width:780px}
.modal.xl{max-width:1040px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:19px;font-weight:700;color:var(--primary-dark)}
.modal-head{background:linear-gradient(180deg,#fff,#fdf7f8);border-radius:18px 18px 0 0}
.modal-close{width:34px;height:34px;border-radius:8px;font-size:20px;color:var(--muted)}
.modal-close:hover{background:#f1f5f9}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toggle{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.toggle button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.toggle button.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.preview{background:#f8fafc;border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-family:var(--mono);font-size:14px}
.preview .line{display:flex;justify-content:space-between}
.preview .tot{font-size:18px;font-weight:800;border-top:1px dashed #cbd5e1;padding-top:6px;margin-top:4px}
.toasts{position:fixed;bottom:92px;left:16px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:#3a2a2f;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;max-width:360px;animation:slide .2s ease;border-left:5px solid var(--blue)}
.toast.success{border-color:#4ade80}
.toast.error{border-color:#f87171}
.toast.warn{border-color:#fbbf24}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}

/* Modal de pagamento */
.pay-total{background:var(--rose-grad);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:16px}
.pay-total .l{color:#fff3f6;font-size:13px;font-weight:700;letter-spacing:1px}
.pay-total .v{font-family:var(--mono);font-size:44px;font-weight:800;color:#fff;text-align:right}
.pay-total .d{display:flex;justify-content:space-between;font-size:13px;color:#fde8ee;font-family:var(--mono)}
.methods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.method{border:2px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;background:#fff;position:relative}
.method .ic{font-size:28px}
.method .k{position:absolute;top:6px;left:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.method:hover{border-color:#efb3c3}
.method.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.change-box{margin-top:14px;border-radius:14px;padding:14px 18px;background:var(--green-soft);display:flex;justify-content:space-between;align-items:center}
.change-box .l{font-weight:800;color:#166534}
.change-box .v{font-family:var(--mono);font-size:32px;font-weight:800;color:#166534}
.change-box.neg{background:var(--red-soft)}
.change-box.neg .l,.change-box.neg .v{color:#991b1b}
.check{display:flex;align-items:center;gap:10px;font-weight:600;margin-top:16px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.info-box{background:var(--blue-soft);color:#1e3a8a;border-radius:12px;padding:14px;font-weight:600}
.big-input{font-size:28px !important;font-family:var(--mono);font-weight:800;text-align:right}

/* Busca F2 */
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:7px 13px;border-radius:999px;background:#f1f5f9;border:1px solid var(--line);font-weight:600;font-size:13px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.prod-card{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;transition:.12s}
.prod-card:hover,.prod-card.active{border-color:var(--primary);box-shadow:0 4px 14px rgba(212,113,140,.18);transform:translateY(-1px)}
.prod-card .ph{overflow:hidden;height:84px;border-radius:10px;background:linear-gradient(135deg,var(--primary-soft),var(--gold-soft));display:flex;align-items:center;justify-content:center;font-size:46px}
.prod-card .nm{font-weight:700;font-size:14px;line-height:1.25;min-height:36px}
.prod-card .pr{font-weight:800;color:var(--primary-dark);font-family:var(--mono);font-size:16px}
.prod-card .st{font-size:12px;color:var(--muted)}
.prod-card.out{opacity:.5}

/* Embalagem */
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gift-opt{border:2px solid var(--line);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;background:#fff}
.gift-opt:hover{border-color:var(--primary);background:var(--primary-soft)}
.gift-opt .ic{font-size:40px}
.gift-opt .nm{font-weight:700;text-align:center;font-size:14px}
.gift-opt .pr{font-family:var(--mono);font-weight:800;color:var(--primary-dark)}
.gift-opt .k{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:12px;background:#f1f5f9;border-radius:6px;padding:1px 6px}

.success-big{text-align:center;padding:10px 0}
.success-big .ic{font-size:64px}
.success-big img{width:170px;margin-bottom:4px}
.success-big h3{font-size:24px;margin:8px 0 4px}
.success-big .change{font-family:var(--mono);font-size:46px;font-weight:800;color:var(--green);margin-top:10px}

/* Recibo (impressão) */
#printArea{display:none}
.receipt{width:72mm;font-family:var(--mono);font-size:12px;color:#000;line-height:1.35}
.receipt .c{text-align:center}
.receipt .b{font-weight:bold}
.receipt .big{font-size:16px;font-weight:bold}
.receipt .hr{border-top:1px dashed #000;margin:6px 0}
.receipt .row{display:flex;justify-content:space-between;gap:6px}
.receipt .it{margin:3px 0}
.receipt .rlogo{display:block;width:44mm;margin:0 auto 2px}
.receipt .heart{text-align:center;letter-spacing:2px}
.receipt .voucher-code{font-size:22px;font-weight:bold;text-align:center;border:2px dashed #000;padding:6px;margin:8px 0;letter-spacing:2px}
@media print{
  @page{margin:4mm}
  html,body{overflow:visible;height:auto;background:#fff}
  #app,#modalBackdrop,#toasts{display:none !important}
  #printArea{display:block}
}

   ========================================================= */
@media (max-width:1200px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const round2 = v => Math.round((Number(v) || 0) * 100) / 100;
const fmt = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n, l = 6) => String(n).padStart(l, '0');
const fmtDate = d => new Date(d).toLocaleDateString('pt-BR');
const fmtDateTime = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function parseMoney(str) {
  if (typeof str === 'number') return round2(str);
  str = String(str || '').trim().replace(/\s|R\$/g, '');
  if (!str) return 0;
  if (str.includes(',')) str = str.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(str);
  return isNaN(n) ? 0 : round2(n);
}

/* Categorias: ficam em DB.categories (editáveis no Painel → Produtos → Categorias).
   CATEGORIES / CAT_EMOJI / SKU_PREFIX são recalculados por refreshCategories(). */
const DEFAULT_CATEGORIES = [
  ['Decoração', '🏺', 'DEC'], ['Brinquedos', '🧸', 'BRI'], ['Papelaria', '✏️', 'PAP'], ['Canecas/Copos', '☕', 'CAN'],
  ['Eletrônicos', '🎧', 'ELE'], ['Embalagens', '🎀', 'EMB', true], ['Outros', '🎁', 'OUT']
];
const catSlug = n => String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const defaultCategories = () => DEFAULT_CATEGORIES.map(([name, emoji, prefix, wrap], i) => ({ id: 'cat-' + catSlug(name), name, emoji, prefix, wrap: !!wrap, order: i, updatedAt: '2026-01-01T00:00:00.000Z' }));
let CATEGORIES = [], CAT_EMOJI = {}, SKU_PREFIX = {}, WRAP_CATS = new Set();
function refreshCategories(db) {
  db = db || DB; if (!db) return;
  const cats = [...(db.categories || [])].sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, 'pt-BR'));
  CATEGORIES = cats.map(c => c.name);
  CAT_EMOJI = {}; SKU_PREFIX = {}; WRAP_CATS = new Set();
  cats.forEach(c => { CAT_EMOJI[c.name] = c.emoji || '🏷️'; if (c.prefix) SKU_PREFIX[c.name] = c.prefix; if (c.wrap) WRAP_CATS.add(c.name); });
  // produtos com categoria que não está na lista (ex.: veio de outro caixa) continuam aparecendo
  (db.products || []).forEach(p => { if (p.category && !CATEGORIES.includes(p.category)) { CATEGORIES.push(p.category); CAT_EMOJI[p.category] = '🏷️'; } });
}
const catCount = name => DB.products.filter(p => p.category === name).length;
const METHODS = { dinheiro: 'Dinheiro', pix: 'Pix', debito: 'Débito', credito: 'Crédito', fiado: 'A prazo (fiado)', vale: 'Vale-Troca' };
const METHOD_ICON = { dinheiro: '💵', pix: '⚡', debito: '💳', credito: '💳', fiado: '📒', vale: '🎟️' };

/* Código de barras EAN-13 com dígito verificador */
function ean13(base12) {
  const d = base12.split('').map(Number);
  const s = d.reduce((a, n, i) => a + n * (i % 2 ? 3 : 1), 0);
  return base12 + ((10 - (s % 10)) % 10);
}
function generateInternalCode() {
  let code;
  do { code = ean13('200' + String(Math.floor(Math.random() * 1e9)).padStart(9, '0')); }
  while (DB.products.some(p => p.code === code));
  return code;
}

/* SHA-256 em JavaScript puro (funciona até sem internet e em arquivo local) */
const sha256hex = (() => {
  const K = [], H0 = [];
  let n = 2, c = 0;
  const isPrime = x => { for (let f = 2; f * f <= x; f++) if (x % f === 0) return false; return true; };
  const frac = x => ((x - Math.floor(x)) * 0x100000000) >>> 0;
  while (c < 64) { if (isPrime(n)) { if (c < 8) H0[c] = frac(Math.pow(n, 1 / 2)); K[c] = frac(Math.pow(n, 1 / 3)); c++; } n++; }
  const rotr = (x, r) => (x >>> r) | (x << (32 - r));
  return str => {
    const bytes = Array.from(new TextEncoder().encode(str));
    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    const hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
    bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255, (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
    const H = H0.slice(), W = new Array(64);
    for (let i = 0; i < bytes.length; i += 64) {
      for (let t = 0; t < 16; t++) W[t] = (bytes[i + t * 4] << 24) | (bytes[i + t * 4 + 1] << 16) | (bytes[i + t * 4 + 2] << 8) | bytes[i + t * 4 + 3];
      for (let t = 16; t < 64; t++) {
        const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
        const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
        W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
      }
      let [a, b, c2, d, e, f, g, h] = H;

/* ---------------------------------------------------------
   IndexedDB: guarda muito mais que o localStorage e é mais robusto.
   - Banco "ManuPresentesPDV", tabela "kv" (dados do sistema)

const IDB_NAME = 'ManuPresentesPDV', IDB_VERSION = 2, SNAPSHOT_KEEP = 7;

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('Navegador sem IndexedDB'));
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots');
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
    };
    req.onsuccess = () => { const db = req.result; db.onversionchange = () => { db.close(); toast('O sistema foi atualizado em outra aba. Recarregue esta página (F5).', 'warn', 10000); }; resolve(db); };
    req.onerror = () => reject(req.error);
    req.onblocked = () => setTimeout(() => toast('Feche as outras abas do sistema para concluir a atualização.', 'warn', 8000), 1500);
  });

function idbTx(store, mode, fn) {

    const r = fn(tx.objectStore(store));
    let out;
    if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);

}

    catch (e) { console.error(e); }
  }
  if (!data) {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { data = JSON.parse(raw); fromLocalStorage = true; } }
    catch (e) { console.error(e); }
  }
  if (data) {
    DB = normalizeDB(data);
    if (fromLocalStorage && idb) {
      // Migração automática: localStorage -> IndexedDB (confere antes de apagar o antigo)
      try {
        await writeNow();
        const back = JSON.parse(await idbGet('kv', 'db'));
        if (back && back.products.length === DB.products.length && back.sales.length === DB.sales.length) {
          localStorage.removeItem(LS_KEY);

}
async function writeNow() {

/* ---------- Cópias diárias automáticas (dentro do navegador) ---------- */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
async function saveSnapshot(label) {
  if (!idb) return false;
  try {
    const key = dayKey() + (label ? ' ' + label : '');
    await idbPut('snapshots', key, JSON.stringify({ savedAt: new Date().toISOString(), label: label || 'Cópia diária automática', data: DB }));
    const keys = (await idbKeys('snapshots')).map(String).sort();
    const daily = keys.filter(k => k.length === 10), extra = keys.filter(k => k.length !== 10);
    for (const k of daily.slice(0, Math.max(0, daily.length - SNAPSHOT_KEEP))) await idbDel('snapshots', k);
    for (const k of extra.slice(0, Math.max(0, extra.length - 5))) await idbDel('snapshots', k);
    DB.backup.lastSnapshot = new Date().toISOString();
    saveDB();
    return true;
  } catch (e) { console.error('Falha ao criar cópia automática', e); return false; }
}
async function dailySnapshot() {
  const last = DB.backup.lastSnapshot;
  if (!last || dayKey(new Date(last)) !== dayKey()) await saveSnapshot();
}

/* ---------- Lembrete / download automático diário ---------- */
function backupPending() { const l = DB.backup.lastDownload; return !l || dayKey(new Date(l)) !== dayKey(); }
function updateBackupBadge() {
  const b = $('#backupBadge'); if (!b) return;
  b.classList.toggle('hidden', !(DB.settings.autoBackupMode !== 'desligado' && backupPending() && (DB.sales.length || DB.backup.lastDownload)));

function checkDailyBackup() {
  if (!DB) return;
  updateBackupBadge();
  const m = DB.settings.autoBackupMode;
  if (m === 'desligado' || !backupPending()) return;
  if (!DB.sales.length && !DB.backup.lastDownload) return; // sistema novo, ainda sem movimento
  if (m === 'automatico') { exportBackup(true); return; }
  if (DB.backup.lastReminder === dayKey()) return;
  if (modalState || DB.cart.items.length) return; // não interrompe uma venda; tenta de novo mais tarde
  DB.backup.lastReminder = dayKey(); saveDB();

const getProduct = id => DB.products.find(p => p.id === id);
/* ---------- Vários caixas ----------
   Cada computador é um "caixa" (ex.: CX1, CX2). As vendas são numeradas por caixa (CX1-000012),
   cada caixa tem sua própria abertura/fechamento, e o estoque é calculado somando as
   ENTRADAS e SAÍDAS de todos os caixas, então dois caixas vendendo ao mesmo tempo
   (mesmo sem internet) dão baixa corretamente quando sincronizam. */
const myCaixa = () => (syncCfg && syncCfg.caixa) || '';
const currentCash = () => DB.cashSessions.find(c => !c.closedAt && (c.caixa || '') === myCaixa());
const saleNo = s => (s.caixa ? s.caixa + '-' : '') + pad(s.number);
function nextSaleNumber(peek = false) {
  const c = myCaixa();
  if (!c) return peek ? DB.counters.sale + 1 : ++DB.counters.sale;
  const n = 1 + DB.sales.filter(x => !x.caixa || x.caixa === c).reduce((m, x) => Math.max(m, x.number || 0), 0);
  if (!peek) DB.counters.sale = Math.max(DB.counters.sale, n);
  return n;
}
const nextSaleLabel = () => (myCaixa() ? myCaixa() + '-' : '') + pad(nextSaleNumber(true));
/* Livro de estoque: toda entrada/saída vira um lançamento */
function stockMove(p, qty, type, ref = '') {
  if (!p || !qty) return;
  p.stock += qty; p.updatedAt = new Date().toISOString();
  DB.stockMoves.push({ id: uid(), pid: p.id, qty, type, ref, date: new Date().toISOString(), caixa: myCaixa() });
}
function recomputeStock() {
  const sum = {};
  DB.stockMoves.forEach(m => { sum[m.pid] = (sum[m.pid] || 0) + m.qty; });
  DB.products.forEach(p => { p.stock = sum[p.id] || 0; });
}
function recomputeVouchers() {
  const live = new Set(DB.sales.filter(x => x.status !== 'cancelada').map(x => x.id));
  DB.vouchers.forEach(v => { v.balance = round2(v.amount - (v.uses || []).filter(u => live.has(u.saleId)).reduce((a, u) => a + u.amount, 0)); });
}
const initMoves = products => products.map(p => ({ id: 'init-' + p.id, pid: p.id, qty: p.stock, type: 'saldo inicial', ref: '', date: p.createdAt || new Date().toISOString(), caixa: '' }));

   ========================================================= */
function cartTotals() {
  const c = DB.cart;
  const subtotal = round2(c.items.reduce((a, i) => a + i.price * i.qty, 0));
  let discount = 0;
  if (c.discount) discount = c.discount.type === '%' ? subtotal * c.discount.value / 100 : c.discount.value;
  discount = round2(Math.min(Math.max(discount, 0), subtotal));
  const gross = round2(subtotal - discount);
  let voucherAmount = 0;
  if (c.voucher) {
    const v = DB.vouchers.find(x => x.code === c.voucher.code);
    voucherAmount = round2(Math.min(v ? v.balance : 0, gross));
  }
  return { subtotal, discount, gross, voucherAmount, toPay: round2(gross - voucherAmount), count: c.items.reduce((a, i) => a + i.qty, 0) };
}
function qtyInCart(pid) { return DB.cart.items.filter(i => i.pid === pid).reduce((a, i) => a + i.qty, 0); }

function addToCart(product, qty = 1) {
  if (!product) return;
  qty = Math.max(1, Math.floor(qty));
  const inCart = qtyInCart(product.id);
  if (inCart + qty > product.stock) {
    const avail = Math.max(0, product.stock - inCart);
    toast(`Estoque insuficiente de "${product.name}". Disponível: ${avail} un.`, 'error', 4000);
    return;
  }
  const existing = DB.cart.items.find(i => i.pid === product.id);
  let idx;
  if (existing) { existing.qty += qty; idx = DB.cart.items.indexOf(existing); }
  else {
    DB.cart.items.push({ pid: product.id, code: product.code || '', sku: product.sku || '', name: product.name, category: product.category, emoji: product.emoji, price: product.price, cost: product.cost, qty });
    idx = DB.cart.items.length - 1;
  }
  DB.cart.lastPid = product.id;
  saveDB();
  renderPDV(idx);
  beep();
}
function setItemQty(idx, qty) {
  const it = DB.cart.items[idx]; if (!it) return;
  qty = Math.floor(qty);
  if (qty <= 0) { removeItem(idx); return; }
  const p = getProduct(it.pid);
  if (p && qty > p.stock) { toast(`Estoque insuficiente. Disponível: ${p.stock} un.`, 'error'); return; }
  it.qty = qty;
  DB.cart.lastPid = it.pid;
  saveDB(); renderPDV(idx);
}
function removeItem(idx) {
  const it = DB.cart.items[idx]; if (!it) return;
  DB.cart.items.splice(idx, 1);
  if (!DB.cart.items.length) { DB.cart.discount = null; DB.cart.voucher = null; }
  if (DB.cart.lastPid === it.pid) DB.cart.lastPid = DB.cart.items.length ? DB.cart.items[DB.cart.items.length - 1].pid : null;
  saveDB(); renderPDV();
  toast(`Item removido: ${it.name}`, 'warn');
}

/* Bip curto (feedback sonoro ao passar produto) */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 1800; g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.07);
  } catch (e) { /* sem som */ }
}

/* =========================================================
   FRENTE DE CAIXA — BUSCA PRINCIPAL
   ========================================================= */
const searchInput = $('#searchInput');
let sugList = [], sugIndex = -1;

function focusSearch() {
  if (mode === 'pdv' && !modalState) setTimeout(() => { if (mode === 'pdv' && !modalState) searchInput.focus(); }, 20);
}
function parseSearch(raw) {
  let term = raw.trim(), qty = 1;
  const m = term.match(/^(\d{1,4})\s*[*xX]\s*(.+)$/);
  if (m) { qty = parseInt(m[1], 10) || 1; term = m[2].trim(); }
  return { term, qty };
}
function searchProducts(term, limit = 8) {
  const t = norm(term);
  if (!t) return [];
  const words = t.split(/\s+/);
  return DB.products
    .filter(p => {
      const hay = norm(p.name + ' ' + p.category + ' ' + (p.code || '') + ' ' + (p.sku || ''));
      return words.every(w => hay.includes(w));
    })
    .sort((a, b) => (norm(a.name).startsWith(t) ? 0 : 1) - (norm(b.name).startsWith(t) ? 0 : 1) || a.name.localeCompare(b.name))
    .slice(0, limit);
}
function renderSuggestions() {
  const box = $('#suggestions');
  const { term } = parseSearch(searchInput.value);
  if (!term || /^\d{6,}$/.test(term)) { hideSuggestions(); return; }
  sugList = searchProducts(term);
  if (sugIndex >= sugList.length) sugIndex = sugList.length - 1;
  if (!sugList.length) { box.innerHTML = `<div class="sug-empty">Nenhum produto encontrado para "${esc(term)}"</div>`; box.classList.remove('hidden'); return; }
  box.innerHTML = sugList.map((p, i) => {
    const remain = p.stock - qtyInCart(p.id);
    return `<div class="sug ${i === sugIndex ? 'active' : ''}" data-i="${i}">
      <div class="em">${prodVisual(p)}</div>
      <div class="info"><div class="nm">${esc(p.name)}</div><div class="meta">${esc(prodCodeLabel(p))} • ${esc(p.category)} • Estoque: ${remain <= 0 ? '<b style="color:var(--red)">esgotado</b>' : remain}</div></div>
      <div class="pr">${fmt(p.price)}</div></div>`;
  }).join('');
  box.classList.remove('hidden');
}
function hideSuggestions() { $('#suggestions').classList.add('hidden'); sugList = []; sugIndex = -1; }

searchInput.addEventListener('input', () => { sugIndex = 0; renderSuggestions(); });
searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && sugList.length) { e.preventDefault(); sugIndex = (sugIndex + 1) % sugList.length; renderSuggestions(); }
  else if (e.key === 'ArrowUp' && sugList.length) { e.preventDefault(); sugIndex = (sugIndex - 1 + sugList.length) % sugList.length; renderSuggestions(); }
  else if (e.key === 'Escape') { searchInput.value = ''; hideSuggestions(); }
  else if (e.key === 'Enter') { e.preventDefault(); submitSearch(); }
});
function submitSearch() {
  const { term, qty } = parseSearch(searchInput.value);
  if (!term) { if (DB.cart.items.length) openPayment(); return; }
  // 1) Código de barras exato
  const byCode = findByCode(term);
  if (byCode) { addToCart(byCode, qty); searchInput.value = ''; hideSuggestions(); return; }
  // 2) Sugestão selecionada / primeira sugestão
  const list = searchProducts(term);
  if (list.length) {
    const p = list[Math.max(0, Math.min(sugIndex, list.length - 1))];
    addToCart(p, qty); searchInput.value = ''; hideSuggestions(); return;
  }
  toast(`Produto não encontrado: "${term}"`, 'error');
  searchInput.select();
}
$('#suggestions').addEventListener('mousedown', e => {
  const el = e.target.closest('.sug'); if (!el) return;
  e.preventDefault();
  const { qty } = parseSearch(searchInput.value);
  addToCart(sugList[Number(el.dataset.i)], qty);
  searchInput.value = ''; hideSuggestions(); focusSearch();
});
searchInput.addEventListener('blur', () => setTimeout(hideSuggestions, 150));

/* Mantém a busca sempre focada no PDV */
document.addEventListener('click', e => {
  if (mode !== 'pdv' || modalState) return;
  if (e.target.closest('input,select,textarea')) return;
  focusSearch();
});

/* =========================================================
   F2 — BUSCA RÁPIDA (modal com fotos)
   ========================================================= */
function openSearchModal() {
  let cat = 'Todas', idx = 0, results = [];
  openModal({
    title: '🔍 Buscar Produto (F2)', size: 'xl',
    body: `<input class="input" id="f2Search" placeholder="Digite nome, categoria ou código..." autofocus style="font-size:18px;padding:12px 14px">
      <div class="cat-chips" id="f2Cats">${['Todas', ...CATEGORIES].map(c => `<button class="chip ${c === 'Todas' ? 'active' : ''}" data-cat="${esc(c)}">${c === 'Todas' ? '🗂️' : CAT_EMOJI[c]} ${esc(c)}</button>`).join('')}</div>
      <div class="prod-grid" id="f2Grid"></div>
      <div class="hint" style="margin-top:12px">Clique no produto ou use as setas e Enter para adicionar.</div>`,
    onOpen: m => {
      const draw = () => {
        const t = norm($('#f2Search').value);
        results = DB.products.filter(p => (cat === 'Todas' || p.category === cat) && (!t || t.split(/\s+/).every(w => norm(p.name + ' ' + p.category + ' ' + (p.code || '') + ' ' + (p.sku || '')).includes(w))))
          .sort((a, b) => a.name.localeCompare(b.name));
        if (idx >= results.length) idx = Math.max(0, results.length - 1);
        $('#f2Grid').innerHTML = results.length ? results.map((p, i) => {
          const remain = p.stock - qtyInCart(p.id);
          return `<button class="prod-card ${remain <= 0 ? 'out' : ''} ${i === idx ? 'active' : ''}" data-i="${i}">
            <div class="ph">${prodVisual(p)}</div><div class="nm">${esc(p.name)}</div>
            <div class="pr">${fmt(p.price)}</div><div class="st">${esc(p.category)} • ${remain <= 0 ? 'Esgotado' : remain + ' em estoque'}</div></button>`;
        }).join('') : '<div class="hint">Nenhum produto encontrado.</div>';
      };
      $('#f2Search').addEventListener('input', () => { idx = 0; draw(); });
      $('#f2Cats').addEventListener('click', e => {
        const b = e.target.closest('[data-cat]'); if (!b) return;
        cat = b.dataset.cat; $$('.chip', m).forEach(c => c.classList.toggle('active', c === b)); idx = 0; draw(); $('#f2Search').focus();
      });
      $('#f2Grid').addEventListener('click', e => {
        const b = e.target.closest('.prod-card'); if (!b) return;
        const p = results[Number(b.dataset.i)]; closeModal(); addToCart(p);
      });
      modalState.onKey = e => {
        if (['ArrowRight', 'ArrowDown'].includes(e.key)) { e.preventDefault(); idx = Math.min(results.length - 1, idx + (e.key === 'ArrowDown' ? 4 : 1)); draw(); }
        if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { e.preventDefault(); idx = Math.max(0, idx - (e.key === 'ArrowUp' ? 4 : 1)); draw(); }
      };
      modalState.onEnter = () => { if (results[idx]) { const p = results[idx]; closeModal(); addToCart(p); } };
      draw();
    }
  });
}

/* =========================================================
   F4 — DESCONTO
   ========================================================= */
function openDiscountModal() {
  if (!DB.cart.items.length) { toast('Adicione produtos antes de aplicar desconto.', 'warn'); return; }
  let type = DB.cart.discount ? DB.cart.discount.type : '%';
  const subtotal = cartTotals().subtotal;
  openModal({
    title: '🏷️ Aplicar Desconto (F4)',
    body: `<div class="toggle" id="dType"><button data-t="%">Porcentagem (%)</button><button data-t="R$">Valor (R$)</button></div>
      <div class="field"><label id="dLabel">Desconto</label><input class="input big-input" id="dValue" inputmode="decimal" value="${DB.cart.discount ? fmtNum(DB.cart.discount.value) : ''}" placeholder="0" autofocus></div>
      <div class="quick" id="dQuick"></div>
      <div class="preview" id="dPreview" style="margin-top:14px"></div>`,
    footer: `${DB.cart.discount ? '<button class="btn btn-outline-danger" id="dRemove">Remover desconto</button>' : ''}<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="dOk">Aplicar (Enter)</button>`,
    onOpen: m => {
      const calc = () => {
        const v = parseMoney($('#dValue').value);
        const d = round2(Math.min(type === '%' ? subtotal * Math.min(v, 100) / 100 : v, subtotal));
        $('#dPreview').innerHTML = `<div class="line"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          <div class="line" style="color:var(--red)"><span>Desconto</span><span>- ${fmt(d)}</span></div>
          <div class="line tot"><span>Novo total</span><span>${fmt(subtotal - d)}</span></div>`;
      };
      const setType = t => {
        type = t;
        $$('#dType button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
        $('#dLabel').textContent = t === '%' ? 'Desconto em porcentagem (%)' : 'Desconto em reais (R$)';
        $('#dQuick').innerHTML = (t === '%' ? [5, 10, 15, 20] : [5, 10, 20, 50]).map(v => `<button class="btn btn-sm" data-v="${v}">${t === '%' ? v + '%' : fmt(v)}</button>`).join('');
        calc();
      };
      $('#dType').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { setType(b.dataset.t); $('#dValue').focus(); } });
      $('#dQuick').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { $('#dValue').value = b.dataset.v; calc(); $('#dValue').focus(); } });
      $('#dValue').addEventListener('input', calc);
      $('#dOk').addEventListener('click', () => {
        const v = parseMoney($('#dValue').value);
        if (v <= 0) { DB.cart.discount = null; }
        else if (type === '%' && v > 100) { toast('O desconto não pode passar de 100%.', 'error'); return; }
        else if (type === 'R$' && v > subtotal) { toast('O desconto não pode ser maior que o subtotal.', 'error'); return; }
        else DB.cart.discount = { type, value: v };
        saveDB(); closeModal(); renderPDV();
        toast(DB.cart.discount ? 'Desconto aplicado!' : 'Desconto removido.', 'success');
      });
      if ($('#dRemove')) $('#dRemove').addEventListener('click', () => { DB.cart.discount = null; saveDB(); closeModal(); renderPDV(); toast('Desconto removido.', 'warn'); });
      setType(type);
    }
  });
}

function openVoucherModal() {
  if (!DB.cart.items.length) { toast('Adicione produtos antes de usar o vale-troca.', 'warn'); return; }
  const applied = DB.cart.voucher;
  openModal({
    title: '🎟️ Usar Vale-Troca (F8)',
    body: `${applied ? `<div class="info-box" style="margin-bottom:14px">Vale aplicado nesta venda: <b>${esc(applied.code)}</b> (−${fmt(cartTotals().voucherAmount)})</div>` : ''}
      <div class="field"><label>Código do vale-troca</label><input class="input big-input" id="vCode" style="text-align:left;text-transform:uppercase" placeholder="VT-XXXXXX" autofocus></div>
      <div id="vInfo"></div>
      ${activeVouchersHint()}`,
    footer: `${applied ? '<button class="btn btn-outline-danger" id="vRemove">Remover vale</button>' : ''}<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="vOk">Aplicar (Enter)</button>`,
    onOpen: m => {
      const check = () => {
        const code = $('#vCode').value.trim().toUpperCase();
        const v = DB.vouchers.find(x => x.code === code);
        const info = $('#vInfo');
        if (!code) { info.innerHTML = ''; return null; }
        if (!v) { info.innerHTML = '<span class="badge b-red">Vale não encontrado</span>'; return null; }
        if (v.balance <= 0) { info.innerHTML = '<span class="badge b-red">Este vale já foi totalmente utilizado</span>'; return null; }
        const use = Math.min(v.balance, cartTotals().gross);
        info.innerHTML = `<div class="preview"><div class="line"><span>Saldo do vale</span><span>${fmt(v.balance)}</span></div><div class="line"><span>Será abatido</span><span>- ${fmt(use)}</span></div>
          ${v.balance > use ? `<div class="line hint"><span>Saldo restante após a compra</span><span>${fmt(v.balance - use)}</span></div>` : ''}</div>`;
        return v;
      };
      $('#vCode').addEventListener('input', check);
      m.querySelectorAll('[data-vcode]').forEach(b => b.addEventListener('click', () => { $('#vCode').value = b.dataset.vcode; check(); $('#vCode').focus(); }));
      $('#vOk').addEventListener('click', () => {
        const v = check(); if (!v) { toast('Informe um vale-troca válido.', 'error'); return; }
        DB.cart.voucher = { code: v.code }; saveDB(); closeModal(); renderPDV(); toast('Vale-troca aplicado!', 'success');
      });
      if ($('#vRemove')) $('#vRemove').addEventListener('click', () => { DB.cart.voucher = null; saveDB(); closeModal(); renderPDV(); toast('Vale removido da venda.', 'warn'); });
    }
  });

function activeVouchersHint() {
  const act = DB.vouchers.filter(v => v.balance > 0).slice(-5).reverse();
  if (!act.length) return '';
  return `<div class="hint" style="margin-top:14px">Vales ativos recentes (clique para preencher):</div>
    <div class="quick">${act.map(v => `<button class="btn btn-sm" data-vcode="${esc(v.code)}">${esc(v.code)} • ${fmt(v.balance)}</button>`).join('')}</div>`;
}

/* =========================================================
   F10 — FINALIZAR VENDA / PAGAMENTO
   ========================================================= */
let lastPrintChoice = false;
function openPayment() {
  if (!DB.cart.items.length) { toast('Nenhum produto no cupom.', 'warn'); return; }
  if (!currentCash()) { openCashModal(openPayment); toast('Abra o caixa para finalizar a venda.', 'warn'); return; }
  const t = cartTotals();
  const pay = { method: t.toPay > 0 ? 'dinheiro' : 'vale', installments: 1 };
  openModal({
    title: '💳 Finalizar Venda (F10)', size: 'lg',
    body: `<div class="pay-total">
        <div class="l">TOTAL A PAGAR</div><div class="v">${fmt(t.toPay)}</div>
        <div class="d"><span>Subtotal ${fmt(t.subtotal)}</span>${t.discount > 0 ? `<span>Desc. -${fmt(t.discount)}</span>` : ''}${t.voucherAmount > 0 ? `<span>Vale -${fmt(t.voucherAmount)}</span>` : ''}<span>${t.count} itens</span></div>
      </div>
      ${t.toPay > 0 ? `<div class="methods" id="payMethods">
        <button class="method" data-m="dinheiro"><span class="k">1</span><span class="ic">💵</span>Dinheiro</button>
        <button class="method" data-m="pix"><span class="k">2</span><span class="ic">⚡</span>Pix</button>
        <button class="method" data-m="debito"><span class="k">3</span><span class="ic">💳</span>Débito</button>
        <button class="method" data-m="credito"><span class="k">4</span><span class="ic">💳</span>Crédito</button>
        <button class="method" data-m="fiado"><span class="k">5</span><span class="ic">📒</span>A prazo (fiado)</button>
      </div>` : ''}
      <div class="field" style="margin-bottom:14px"><label>👤 Cliente (opcional)</label><div id="payCust"></div></div>
      <div id="payDetail"></div>
      <label class="check"><input type="checkbox" id="payPrint" ${lastPrintChoice ? 'checked' : ''}> 🖨️ Imprimir recibo não-fiscal ao finalizar</label>`,
    footer: `<button class="btn" data-close>Voltar (Esc)</button><button class="btn btn-success btn-lg" data-primary id="payOk">✔ Confirmar Pagamento (Enter)</button>`,
    onOpen: m => {
      const detail = () => {
        $$('.method', m).forEach(b => b.classList.toggle('active', b.dataset.m === pay.method));
        const d = $('#payDetail');
        if (pay.method === 'vale') d.innerHTML = `<div class="info-box">🎟️ O valor total está coberto pelo vale-troca. Basta confirmar.</div>`;
        else if (pay.method === 'dinheiro') {
          const notes = [...new Set([Math.ceil(t.toPay), Math.ceil(t.toPay / 10) * 10, Math.ceil(t.toPay / 50) * 50, Math.ceil(t.toPay / 100) * 100])].filter(v => v >= t.toPay).slice(0, 4);
          d.innerHTML = `<div class="field" style="margin-bottom:6px"><label>Valor recebido do cliente</label><input class="input big-input" id="payReceived" inputmode="decimal" placeholder="${fmtNum(t.toPay)}"></div>
            <div class="quick"><button class="btn btn-sm" data-q="${t.toPay}">Valor exato</button>${notes.map(v => `<button class="btn btn-sm" data-q="${v}">${fmt(v)}</button>`).join('')}</div>
            <div class="change-box" id="changeBox"><span class="l">TROCO</span><span class="v" id="changeVal">R$ 0,00</span></div>`;
          const upd = () => {
            const raw = $('#payReceived').value.trim();
            const r = raw ? parseMoney(raw) : t.toPay;
            const ch = round2(r - t.toPay);
            $('#changeBox').classList.toggle('neg', ch < 0);
            $('#changeBox .l').textContent = ch < 0 ? 'FALTAM' : 'TROCO';
            $('#changeVal').textContent = fmt(Math.abs(ch));
          };
          $('#payReceived').addEventListener('input', upd);
          d.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { $('#payReceived').value = fmtNum(Number(b.dataset.q)); upd(); $('#payReceived').focus(); }));
          upd();
          setTimeout(() => $('#payReceived') && $('#payReceived').focus(), 30);
        } else if (pay.method === 'pix') {
          d.innerHTML = `<div class="info-box">⚡ Solicite o Pix de <b>${fmt(t.toPay)}</b> ao cliente.${DB.settings.pixKey ? `<br>Chave Pix: <b>${esc(DB.settings.pixKey)}</b>` : '<br><span style="font-weight:400">(Cadastre sua chave Pix em Configurações para exibi-la aqui.)</span>'}<br><span style="font-weight:400">Confirme somente após o recebimento.</span></div>`;
        } else if (pay.method === 'debito') {
          d.innerHTML = `<div class="info-box">💳 Passe o cartão de débito na maquininha no valor de <b>${fmt(t.toPay)}</b> e confirme após aprovação.</div>`;
        } else if (pay.method === 'credito') {
          d.innerHTML = `<div class="field"><label>Parcelamento</label><select class="select" id="payInst">${Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === pay.installments ? 'selected' : ''}>${n}x de ${fmt(t.toPay / n)}${n === 1 ? ' (à vista)' : ' sem juros'}</option>`).join('')}</select></div>
            <div class="info-box">💳 Passe o cartão de crédito na maquininha e confirme após aprovação.</div>`;
          $('#payInst').addEventListener('change', e => pay.installments = Number(e.target.value));
        } else if (pay.method === 'fiado') {
          pay.firstDue = pay.firstDue || addDaysISO(todayISO(), 30);
          const c = DB.cart.customerId && getCustomer(DB.cart.customerId), open = c ? fiadoOpenFor(c.id) : [];
          d.innerHTML = `${c ? '' : '<div class="info-box" style="background:var(--amber-soft,#fef3c7);color:#92400e;margin-bottom:10px">📒 Para vender a prazo, escolha o cliente acima (é obrigatório).</div>'}
            ${open.length ? `<div class="hint" style="margin-bottom:8px">⚠️ ${esc(firstName(c.name))} já tem ${open.length} parcela(s) em aberto: <b>${fmt(open.reduce((a, b) => a + b.amount, 0))}</b>${open.some(b => b.due < todayISO()) ? ' (com atraso)' : ''}.</div>` : ''}
            <div class="grid-2"><div class="field"><label>Parcelas</label><select class="select" id="payFiN">${Array.from({ length: 6 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === pay.installments ? 'selected' : ''}>${n}x de ${fmt(t.toPay / n)}</option>`).join('')}</select></div>
            <div class="field"><label>1º vencimento</label><input class="input" type="date" id="payFiDue" value="${pay.firstDue}"></div></div>
            <p class="hint">As parcelas ficam em Painel → Financeiro → A receber / Fiado.</p>`;
          $('#payFiN').addEventListener('change', e => pay.installments = Number(e.target.value));
          $('#payFiDue').addEventListener('change', e => pay.firstDue = e.target.value || pay.firstDue);
        }
      };
      customerWidget($('#payCust'), () => DB.cart.customerId, id => { DB.cart.customerId = id; saveDB(); renderPDV(); if (pay.method === 'fiado') detail(); });
      if ($('#payMethods')) $('#payMethods').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { pay.method = b.dataset.m; pay.installments = 1; detail(); } });
      modalState.onKey = e => {
        const a = document.activeElement;
        if (t.toPay > 0 && /^[1-5]$/.test(e.key) && !(a && a.tagName === 'INPUT' && a.type !== 'checkbox')) {
          e.preventDefault(); pay.method = ['dinheiro', 'pix', 'debito', 'credito', 'fiado'][Number(e.key) - 1]; pay.installments = 1; detail();
        }
        if (e.key === 'F10') { e.preventDefault(); $('#payOk').click(); }
      };
      $('#payOk').addEventListener('click', () => {
        let received = t.toPay, change = 0;
        if (pay.method === 'dinheiro') {
          const raw = $('#payReceived').value.trim();
          received = raw ? parseMoney(raw) : t.toPay;
          if (received < t.toPay) { toast('Valor recebido é menor que o total!', 'error'); $('#payReceived').focus(); return; }
          change = round2(received - t.toPay);
        }
        if (pay.method === 'fiado' && !DB.cart.customerId) { toast('Escolha o cliente para vender a prazo (fiado).', 'error', 4000); const i = $('#payCust input'); if (i) i.focus(); return; }
        lastPrintChoice = $('#payPrint').checked;
        finalizeSale({ method: pay.method, installments: ['credito', 'fiado'].includes(pay.method) ? pay.installments : 1, received, change, firstDue: pay.method === 'fiado' ? pay.firstDue : undefined }, lastPrintChoice);
      });
      detail();
    }
  });
}

function finalizeSale(payment, print) {
  const t = cartTotals();
  const cash = currentCash();
  // Revalida estoque
  for (const it of DB.cart.items) {
    const p = getProduct(it.pid);
    if (p && it.qty > p.stock) { toast(`Estoque insuficiente de ${p.name}.`, 'error'); return; }
  }
  const sale = {
    id: uid(), number: nextSaleNumber(), caixa: myCaixa() || undefined, date: new Date().toISOString(), cashId: cash ? cash.id : null,
    items: DB.cart.items.map(i => ({ pid: i.pid, code: i.code, sku: i.sku, name: i.name, category: i.category, emoji: i.emoji, qty: i.qty, price: i.price, cost: i.cost, returned: 0 })),
    subtotal: t.subtotal, discount: t.discount, discountInfo: DB.cart.discount, gross: t.gross,
    voucher: t.voucherAmount > 0 ? { code: DB.cart.voucher.code, amount: t.voucherAmount } : null,
    total: t.toPay, payment, status: 'concluida', returns: [],
    customer: custSnap(DB.cart.customerId)
  };
  sale.feeRate = feeRate(payment.method, payment.installments);
  sale.fee = round2(sale.total * sale.feeRate / 100);
  if (payment.method === 'fiado') createFiadoBills(sale, payment.installments || 1, payment.firstDue || addDaysISO(todayISO(), 30));
  // Baixa de estoque
  sale.items.forEach(i => stockMove(getProduct(i.pid), -i.qty, 'venda', sale.id));
  // Abate do vale
  if (sale.voucher) {
    const v = DB.vouchers.find(x => x.code === sale.voucher.code);
    if (v) { v.balance = round2(v.balance - sale.voucher.amount); v.uses = v.uses || []; v.uses.push({ saleId: sale.id, saleNumber: sale.number, saleNo: saleNo(sale), amount: sale.voucher.amount, date: sale.date }); }
  }
  DB.sales.push(sale);
  DB.cart = emptyCart();
  saveDB();
  closeModal();
  renderPDV();
  if (print) printHTML(receiptHTML(sale));
  openModal({
    title: '✅ Venda finalizada',
    body: `<div class="success-big"><img src="${LOGO_FULL}" alt=""><h3>Venda nº ${saleNo(sale)} concluída!</h3>
      <div class="hint">${METHOD_ICON[payment.method]} ${METHODS[payment.method]}${['credito', 'fiado'].includes(payment.method) ? ` em ${payment.installments}x` : ''} • Total ${fmt(sale.total)}${payment.method === 'fiado' ? `<br>1º vencimento: ${fmtISO(payment.firstDue)}` : ''}</div>
      ${payment.method === 'dinheiro' ? `<div class="change">Troco: ${fmt(payment.change)}</div>` : ''}</div>`,
    footer: `<button class="btn" id="sPrint">🖨️ Imprimir recibo</button><button class="btn btn-success" data-primary data-close>Nova venda (Enter)</button>`,
    onOpen: m => $('#sPrint', m).addEventListener('click', () => printHTML(receiptHTML(sale)))
  });
}

function saleNet(s) {
  if (s.status === 'cancelada') return { revenue: 0, profit: 0, cost: 0, items: [] };
  const r = s.subtotal > 0 ? s.gross / s.subtotal : 0;
  let revenue = 0, cost = 0;
  const items = s.items.map(i => {
    const q = i.qty - (i.returned || 0);
    const rev = i.price * r * q, c = i.cost * q;
    revenue += rev; cost += c;
    return { ...i, netQty: q, netRevenue: rev };
  });
  return { revenue: round2(revenue), cost: round2(cost), profit: round2(revenue - cost), items };
}
function periodStart(p) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (p === 'today') return d;
  if (p === '7d') { d.setDate(d.getDate() - 6); return d; }
  if (p === 'month') { d.setDate(1); return d; }
  return null;
}
function salesInPeriod(p) {
  const start = periodStart(p);
  return DB.sales.filter(s => s.status !== 'cancelada' && (!start || new Date(s.date) >= start));
}
