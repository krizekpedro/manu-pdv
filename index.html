    $('#prodBody').innerHTML = list.length ? list.map(p => {
      const mg = p.cost > 0 ? (p.price - p.cost) / p.cost * 100 : 0;
      const low = p.stock <= p.minStock;
      const sel = adminState.selProducts.has(p.id);
      return `<tr class="${sel ? 'sel' : ''}">
        <td class="ck"><input type="checkbox" data-sel="${p.id}" ${sel ? 'checked' : ''}></td>
        <td><div class="thumb">${prodVisual(p)}</div></td>
        <td class="mono">${esc(p.sku || '—')}</td>
        <td class="mono">${esc(p.code || '—')}</td>
        <td><b>${esc(p.name)}</b></td>
        <td><span class="badge b-gray">${esc(p.category)}</span></td>
        ${can('ver_custo') ? `<td class="r mono">${fmt(p.cost)}</td>` : ''}
        <td class="r mono"><b>${fmt(p.price)}</b></td>
        ${can('ver_custo') ? `<td class="r"><span class="badge ${mg >= 50 ? 'b-green' : mg >= 20 ? 'b-amber' : 'b-red'}">${fmtNum(mg)}%</span></td>` : ''}
        <td class="c"><span class="badge ${p.stock <= 0 ? 'b-red' : low ? 'b-amber' : 'b-green'}">${p.stock}</span></td>
        <td class="c mono">${p.minStock}</td>
        <td><div class="actions">
          <button class="icon-btn" title="Imprimir etiqueta" data-act="label" data-id="${p.id}">🏷️</button>
          <button class="icon-btn" title="Entrada de estoque" data-act="stock" data-id="${p.id}">📦</button>
          <button class="icon-btn" title="Editar" data-act="edit" data-id="${p.id}">✏️</button>
          <button class="icon-btn" title="Excluir" data-act="del" data-id="${p.id}">🗑️</button>
        </div></td></tr>`;
    }).join('') : `<tr><td colspan="13" class="empty-row">Nenhum produto encontrado.</td></tr>`;
    lastList = list; drawBulk();
  };
  $('#prodSearch').addEventListener('input', e => { adminState.prodSearch = e.target.value; draw(); });
  $('#prodCat').addEventListener('change', e => { adminState.prodCat = e.target.value; draw(); });
  $('#prodLow').addEventListener('change', draw);
  $('#btnNewProduct').addEventListener('click', () => openProductModal());
  $('#btnCategories').addEventListener('click', openCategoriesModal);
  $('#selAll').addEventListener('change', e => { lastList.forEach(p => e.target.checked ? adminState.selProducts.add(p.id) : adminState.selProducts.delete(p.id)); draw(); });
  $('#prodBody').addEventListener('change', e => { const c = e.target.closest('[data-sel]'); if (!c) return; c.checked ? adminState.selProducts.add(c.dataset.sel) : adminState.selProducts.delete(c.dataset.sel); c.closest('tr').classList.toggle('sel', c.checked); drawBulk(); });
  $('#prodBody').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const p = getProduct(b.dataset.id);
    if (b.dataset.act === 'edit') openProductModal(p);
    if (b.dataset.act === 'label') openLabelsModal([p]);
    if (b.dataset.act === 'stock') openRestockModal(p.id);
    if (b.dataset.act === 'del') confirmModal(`Excluir o produto <b>${esc(p.name)}</b>?<br><span class="hint">As vendas antigas continuam registradas normalmente.</span>`, () => {
      if (photoOf(p)) setPhoto(p, null);
      adminState.selProducts.delete(p.id);
      DB.products = DB.products.filter(x => x.id !== p.id);
      DB.deleted = DB.deleted || []; DB.deleted.push(p.id);
      DB.cart.items = DB.cart.items.filter(i => i.pid !== p.id);
      saveDB(); renderAdmin(); toast('Produto excluído.', 'warn');
    }, { title: 'Excluir produto', yesText: 'Excluir', danger: true });
  });
  draw();
}

/* ---------- Categorias: criar, renomear, ícone, prefixo do SKU, F6, ordem e excluir ---------- */
function addCategory(name, extra = {}) {
  const c = { id: 'cat-' + catSlug(name) + '-' + uid().slice(-4), name, emoji: '🏷️', prefix: '', wrap: false, order: (DB.categories || []).length, updatedAt: new Date().toISOString(), ...extra };
  DB.categories.push(c); refreshCategories(); return c;
}
function openCategoriesModal() {
  // cópia de trabalho: nada muda até clicar em Salvar
  let rows = [...DB.categories].sort((a, b) => (a.order ?? 999) - (b.order ?? 999)).map(c => ({ ...c, orig: c.name, count: catCount(c.name), del: false, moveTo: '' }));
  CATEGORIES.filter(n => !rows.some(r => r.name === n)).forEach(n => rows.push({ id: null, name: n, orig: n, emoji: '🏷️', prefix: '', wrap: false, count: catCount(n), del: false, moveTo: '' }));
  const readInputs = m => rows.forEach((r, i) => {
    const g = k => $(`[data-${k}="${i}"]`, m); if (!g('nm')) return;
    r.name = g('nm').value.trim().replace(/\s+/g, ' '); r.emoji = g('em').value.trim(); r.prefix = g('px').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); r.wrap = g('wr').checked;
    if (g('mv')) r.moveTo = g('mv').value;
  });
  const body = () => `<p class="hint" style="margin-bottom:10px">Renomeie, troque o ícone, mude a ordem ou exclua. Ao renomear, todos os produtos daquela categoria são atualizados juntos. As vendas antigas continuam com o nome antigo no histórico.</p>
    <div class="table-wrap"><table class="cat-table">
      <thead><tr><th class="c">Ordem</th><th class="c">Ícone</th><th>Nome da categoria</th><th>Prefixo SKU</th><th class="c" title="Os produtos desta categoria aparecem na tecla F6 (embalagem para presente)">Aparece no F6</th><th class="c">Produtos</th><th></th></tr></thead>
      <tbody>${rows.map((r, i) => r.del ? `<tr class="cat-del"><td></td><td class="c">${esc(r.emoji)}</td><td><s>${esc(r.orig || r.name)}</s> <span class="badge b-red">será excluída</span></td>
          <td colspan="3">${r.count ? `<span class="hint">Mover os ${r.count} produto(s) para:</span> <select class="select" data-mv="${i}" style="max-width:180px">${rows.filter((o, j) => j !== i && !o.del && o.name).map(o => `<option ${o.name === r.moveTo ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>` : '<span class="hint">Sem produtos</span>'}
            <input type="hidden" data-nm="${i}" value="${esc(r.name)}"><input type="hidden" data-em="${i}" value="${esc(r.emoji)}"><input type="hidden" data-px="${i}" value="${esc(r.prefix)}"><input type="checkbox" data-wr="${i}" ${r.wrap ? 'checked' : ''} hidden></td>
          <td class="r"><button class="btn btn-sm" data-undo="${i}">↩️ Desfazer</button></td></tr>`
        : `<tr><td class="c" style="white-space:nowrap"><button class="icon-btn" data-up="${i}" title="Subir" ${i === 0 ? 'disabled' : ''}>▲</button><button class="icon-btn" data-down="${i}" title="Descer" ${i === rows.length - 1 ? 'disabled' : ''}>▼</button></td>
          <td class="c"><input class="input" data-em="${i}" value="${esc(r.emoji)}" maxlength="4" style="width:54px;text-align:center;font-size:18px;padding:6px"></td>
          <td><input class="input" data-nm="${i}" value="${esc(r.name)}" maxlength="40" placeholder="Nome"></td>
          <td><input class="input mono" data-px="${i}" value="${esc(r.prefix)}" maxlength="5" placeholder="Ex.: DEC" style="width:90px;text-transform:uppercase"></td>
          <td class="c"><input type="checkbox" data-wr="${i}" ${r.wrap ? 'checked' : ''}></td>
          <td class="c">${r.count ? `<span class="badge b-gray">${r.count}</span>` : '<span class="hint">0</span>'}</td>
          <td class="r"><button class="icon-btn" data-del="${i}" title="Excluir categoria">🗑️</button></td></tr>`).join('')}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap">
      <input class="input" id="catNewName" placeholder="Nova categoria (ex.: Bijuterias)" maxlength="40" style="flex:1;min-width:200px">
      <input class="input" id="catNewEmoji" placeholder="💍" maxlength="4" style="width:60px;text-align:center;font-size:18px">
      <button class="btn" id="catAdd">＋ Adicionar</button></div>
    <p class="hint" style="margin-top:8px">💡 O prefixo é usado ao gerar SKU automático (ex.: <b>BIJ-0001</b>). "Aparece no F6" mostra os itens daquela categoria na tela de embalagem para presente.</p>
    <div id="catErr" style="min-height:22px;margin-top:6px"></div>`;
  openModal({
    title: '🗂️ Categorias de Produtos', size: 'xl', body: body(),
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="catSave">💾 Salvar categorias</button>`,
    onKey: e => { if (e.key === 'Enter' && document.activeElement && ['catNewName', 'catNewEmoji'].includes(document.activeElement.id)) { e.preventDefault(); $('#catAdd').click(); } else if (e.key === 'Enter') e.preventDefault(); },
    onOpen: m => {
      const redraw = () => { $('.modal-body', m).innerHTML = body(); bind(); };
      const bind = () => {
        const on = (sel, fn) => $$(sel, m).forEach(b => b.addEventListener('click', e => { e.preventDefault(); readInputs(m); fn(+Object.values(b.dataset)[0]); redraw(); }));
        on('[data-up]', i => { if (i > 0) [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]]; });
        on('[data-down]', i => { if (i < rows.length - 1) [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]]; });
        on('[data-del]', i => {
          const r = rows[i];
          if (!r.id && !r.orig) { rows.splice(i, 1); return; } // nova, ainda não salva
          if (rows.filter(o => !o.del).length <= 1) { toast('É preciso ter pelo menos uma categoria.', 'error'); return; }
          r.del = true; r.moveTo = (rows.find((o, j) => j !== i && !o.del) || {}).name || '';
        });
        on('[data-undo]', i => { rows[i].del = false; });
        $('#catAdd', m).addEventListener('click', () => {
          readInputs(m);
          const nm = $('#catNewName', m).value.trim().replace(/\s+/g, ' ');
          if (!nm) { $('#catNewName', m).focus(); return; }
          if (rows.some(o => !o.del && o.name.toLowerCase() === nm.toLowerCase())) { toast('Já existe uma categoria com esse nome.', 'error'); return; }
          const pre = catSlug(nm).replace(/-/g, '').toUpperCase().slice(0, 3);
          rows.push({ id: null, orig: null, name: nm, emoji: $('#catNewEmoji', m).value.trim() || '🏷️', prefix: rows.some(o => o.prefix === pre) ? '' : pre, wrap: false, count: 0, del: false, moveTo: '' });
          redraw(); setTimeout(() => $('#catNewName', m).focus(), 20);
        });
      };
      bind();
      $('#catSave', m).addEventListener('click', () => {
        readInputs(m);
        const live = rows.filter(r => !r.del);
        const err = msg => { $('#catErr', m).innerHTML = `<span class="badge b-red">${esc(msg)}</span>`; };
        if (live.some(r => !r.name)) return err('Toda categoria precisa de um nome.');
        const names = live.map(r => r.name.toLowerCase());
        if (new Set(names).size !== names.length) return err('Existem duas categorias com o mesmo nome.');
        const px = live.map(r => r.prefix).filter(Boolean);
        if (new Set(px).size !== px.length) return err('Existem duas categorias com o mesmo prefixo de SKU.');
        const now = new Date().toISOString();
        const touch = (p, cat) => { p.category = cat; p.updatedAt = now; };
        let renamed = 0, moved = 0;
        // exclusões: move os produtos e marca para apagar também nos outros caixas
        rows.filter(r => r.del).forEach(r => {
          const dest = live.find(o => o.name === r.moveTo) ? r.moveTo : live[0].name;
          const target = live.find(o => (o.orig || o.name) === dest || o.name === dest);
          DB.products.filter(p => p.category === r.orig).forEach(p => { touch(p, target ? target.name : dest); moved++; });
          if (r.id) { DB.categories = DB.categories.filter(c => c.id !== r.id); DB.deleted.push(r.id); }
        });
        // renomeações, ícones, prefixos, F6 e ordem
        live.forEach((r, i) => {
          if (r.orig && r.orig !== r.name) DB.products.filter(p => p.category === r.orig).forEach(p => { touch(p, r.name); renamed++; });
          let c = r.id && DB.categories.find(x => x.id === r.id);
          if (!c) { c = { id: 'cat-' + catSlug(r.name) + '-' + uid().slice(-4) }; DB.categories.push(c); }
          const nv = { name: r.name, emoji: r.emoji || '🏷️', prefix: r.prefix, wrap: !!r.wrap, order: i };
          if (Object.keys(nv).some(k => c[k] !== nv[k])) Object.assign(c, nv, { updatedAt: now });
        });
        refreshCategories();
        if (adminState.prodCat && !CATEGORIES.includes(adminState.prodCat)) adminState.prodCat = '';
        saveDB(); closeModal(); renderAdmin();
        toast(`Categorias salvas!${renamed ? ` ${renamed} produto(s) renomeado(s).` : ''}${moved ? ` ${moved} produto(s) movido(s).` : ''}`, 'success', 4000);
      });
    }
  });
}
function openProductModal(p) {

  const mg0 = p.cost > 0 ? (p.price - p.cost) / p.cost * 100 : 100;
  openModal({
    title: isNew ? '＋ Novo Produto' : '✏️ Editar Produto', size: 'lg',
    body: `
      <div class="photo-box">
        <div class="pv" id="pfPhotoPv">${isNew ? '📷' : prodVisual(p)}</div>
        <div><b>Foto do produto</b> <span class="hint">(opcional)</span><br>

          <button class="btn" id="pfGenSku" type="button" title="Gerar SKU">⚙️ Gerar</button></div></div>
        <div class="field"><label>Código de barras <span class="hint">— opcional</span></label>
          <div class="input-group"><input class="input" id="pfCode" value="${esc(p.code || '')}" style="font-family:var(--mono)" placeholder="Leia com o leitor ou gere">
          <button class="btn" id="pfGen" type="button" title="Gerar código de barras interno (EAN-13)">⚙️ Gerar</button></div></div>
      </div>
      <span class="hint" style="display:block;margin:-6px 0 12px">Os dois são opcionais e servem para achar o produto no caixa (leitor ou digitação). Código de barras interno começa com 200.</span>
      <div class="grid-2">
        <div class="field" style="grid-column:span 2"><label>Nome do produto *</label><input class="input" id="pfName" value="${esc(p.name)}" placeholder="Ex.: Caneca Personalizada 325ml" autofocus></div>
        <div class="field"><label>Categoria</label><select class="select" id="pfCat">${CATEGORIES.map(c => `<option ${c === p.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__new">＋ Nova categoria…</option></select>
          <input class="input" id="pfCatNew" placeholder="Nome da nova categoria" style="display:none;margin-top:6px" maxlength="40"></div>
        <div class="field"><label>Ícone / "foto" (emoji)</label><input class="input" id="pfEmoji" value="${esc(p.emoji)}" placeholder="Ex.: 🧸 ☕ 🎁" maxlength="4"></div>
      </div>
      <div class="grid-3">
        <div class="field" ${can('ver_custo') ? '' : 'style="display:none"'}><label>Preço de custo (R$)</label><input class="input" id="pfCost" inputmode="decimal" value="${fmtNum(p.cost)}"></div>
        <div class="field" ${can('ver_custo') ? '' : 'style="display:none"'}><label>Margem de lucro (%)</label><input class="input" id="pfMargin" inputmode="decimal" value="${fmtNum(mg0)}"></div>
        <div class="field"><label>Preço de venda (R$) *</label><input class="input" id="pfPrice" inputmode="decimal" value="${fmtNum(p.price)}" style="font-weight:800"></div>
      </div>
      <div class="preview" id="pfPreview" style="margin-bottom:14px;${can('ver_custo') ? '' : 'display:none'}"></div>

      </div>`,
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="pfSave">💾 Salvar (Enter)</button>`,
    onOpen: m => {
      const prev = () => {
        const c = parseMoney($('#pfCost').value), pr = parseMoney($('#pfPrice').value);
        const lucro = pr - c;
        $('#pfPreview').innerHTML = `<div class="line"><span>Lucro por unidade</span><span style="color:${lucro >= 0 ? 'var(--green)' : 'var(--red)'}">${fmt(lucro)}</span></div>

      };

      const fromPrice = () => { const c = parseMoney($('#pfCost').value), pr = parseMoney($('#pfPrice').value); $('#pfMargin').value = c > 0 ? fmtNum((pr - c) / c * 100) : '0,00'; prev(); };
      $('#pfCost').addEventListener('input', fromMargin);
      $('#pfMargin').addEventListener('input', fromMargin);
      $('#pfPrice').addEventListener('input', fromPrice);
      $('#pfGen').addEventListener('click', () => { $('#pfCode').value = generateInternalCode(); });
      $('#pfGenSku').addEventListener('click', () => { $('#pfSku').value = generateSku($('#pfCat').value); });
      $('#pfPhoto').addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        try { newPhoto = await compressImage(f); $('#pfPhotoPv').innerHTML = `<img class="pimg" src="${newPhoto}" alt="">`; toast(`Foto pronta (${Math.round(newPhoto.length * 0.75 / 1024)} KB). Clique em Salvar.`, 'success'); }
        catch (err) { toast(err.message, 'error'); }
      });
      $('#pfPhotoDel').addEventListener('click', () => { newPhoto = ''; $('#pfPhotoPv').textContent = $('#pfEmoji').value || CAT_EMOJI[$('#pfCat').value]; });
      $('#pfCat').addEventListener('change', e => {
        const isNewCat = e.target.value === '__new';
        $('#pfCatNew').style.display = isNewCat ? '' : 'none'; if (isNewCat) $('#pfCatNew').focus();
        if (!$('#pfEmoji').value) $('#pfEmoji').placeholder = CAT_EMOJI[e.target.value] || '🏷️';
      });
      $('#pfSave').addEventListener('click', () => {
        const data = {
          code: $('#pfCode').value.trim(), sku: $('#pfSku').value.trim().toUpperCase(), name: $('#pfName').value.trim(), category: $('#pfCat').value, emoji: $('#pfEmoji').value.trim(),
          cost: parseMoney($('#pfCost').value), price: parseMoney($('#pfPrice').value),
          stock: parseInt($('#pfStock').value, 10) || 0, minStock: Math.max(0, parseInt($('#pfMin').value, 10) || 0)
        };
        if (!data.name) { toast('Informe o nome do produto.', 'error'); $('#pfName').focus(); return; }
        if (data.sku && DB.products.some(x => (x.sku || '').toUpperCase() === data.sku && x.id !== p.id)) { toast('Já existe um produto com este SKU.', 'error'); $('#pfSku').focus(); return; }
        if (data.code && DB.products.some(x => x.code === data.code && x.id !== p.id)) { toast('Já existe um produto com este código de barras.', 'error'); $('#pfCode').focus(); return; }
        if (data.price <= 0) { toast('Informe o preço de venda.', 'error'); $('#pfPrice').focus(); return; }
        if (data.category === '__new') {
          const nm = $('#pfCatNew').value.trim().replace(/\s+/g, ' ');
          if (!nm) { toast('Digite o nome da nova categoria.', 'error'); $('#pfCatNew').focus(); return; }
          const ex = CATEGORIES.find(c => c.toLowerCase() === nm.toLowerCase());
          data.category = ex || addCategory(nm).name;
        }
        if (!data.emoji) data.emoji = CAT_EMOJI[data.category] || '🎁';
        const newStock = data.stock; delete data.stock;
        let target;
        if (isNew) { target = { id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), ...data, stock: 0 }; DB.products.push(target); stockMove(target, newStock, 'saldo inicial'); }
        else { target = getProduct(p.id); Object.assign(target, data, { updatedAt: new Date().toISOString() }); stockMove(target, newStock - target.stock, 'ajuste manual'); }
        if (newPhoto !== undefined) setPhoto(target, newPhoto || null);
        saveDB(); closeModal(); renderAdmin(); toast(isNew ? 'Produto cadastrado!' : 'Produto atualizado!', 'success');
      });
      prev();
    }
  });
}
function openRestockModal(id) {
  const p = getProduct(id); if (!p) return;
  openModal({
    title: '📦 Entrada de Estoque',
    body: `<p style="margin-bottom:12px"><b>${p.emoji || ''} ${esc(p.name)}</b><br><span class="hint">Estoque atual: ${p.stock} un. • Mínimo: ${p.minStock} un.</span></p>
      <div class="field"><label>Quantidade recebida (entrada)</label><input class="input big-input" id="rsQty" type="number" step="1" value="${Math.max(1, p.minStock * 2 - p.stock)}" autofocus></div>
      <div class="field" ${can('ver_custo') ? '' : 'style="display:none"'}><label>Novo preço de custo (opcional)</label><input class="input" id="rsCost" inputmode="decimal" placeholder="${fmtNum(p.cost)}"></div>`,
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="rsOk">Confirmar entrada (Enter)</button>`,
    onOpen: m => $('#rsOk', m).addEventListener('click', () => {
      const q = parseInt($('#rsQty').value, 10) || 0;
      if (!q) { toast('Informe a quantidade.', 'error'); return; }
      stockMove(p, q, 'entrada');
      if ($('#rsCost').value.trim()) p.cost = parseMoney($('#rsCost').value);
      saveDB(); closeModal(); renderAdmin(); toast(`Estoque de ${p.name} atualizado para ${p.stock} un.`, 'success');
    })
  });
}

/* ---------- VENDAS E TROCAS ---------- */
function renderSales() {

function cancelSale(s) {

  confirmModal(`Cancelar a venda nº <b>${saleNo(s)}</b> no valor de <b>${fmt(s.gross)}</b>?<br><br>• Os produtos voltam ao estoque<br>• ${s.voucher ? 'O vale-troca usado terá o saldo restituído<br>• ' : ''}A venda sai do faturamento e do caixa`, () => {
    s.items.forEach(i => stockMove(getProduct(i.pid), i.qty - (i.returned || 0), 'cancelamento', s.id));

function genVoucherCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c; do { c = 'VT-' + Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); } while (DB.vouchers.some(v => v.code === c));
  return c;
}
function openReturnModal(s) {

  const avail = s.items.map(i => i.qty - (i.returned || 0));

  openModal({
    title: `🔄 Troca / Devolução • Venda nº ${saleNo(s)}`, size: 'lg',

      ${s.items.map((i, k) => `<tr><td>${i.emoji || ''} ${esc(i.name)}</td><td class="c">${i.qty}</td><td class="c">${avail[k]}</td><td class="r mono">${fmt(i.price * r)}</td>

      </tbody></table>

    footer: `<button class="btn" data-close>Cancelar</button><button class="btn" id="retUse">🛒 Gerar vale e usar agora no caixa</button><button class="btn btn-primary" data-primary id="retOk">🎟️ Gerar Vale-Troca</button>`,
    onOpen: m => {

        let total = 0;
        $$('input[data-k]', m).forEach(inp => {
          const k = Number(inp.dataset.k);
          let q = parseInt(inp.value, 10) || 0;
          q = Math.max(0, Math.min(q, avail[k])); if (String(q) !== inp.value && inp.value !== '') inp.value = q;
          total += q * s.items[k].price * r;
        });
        $('#retTotal').textContent = fmt(total);
        return round2(total);
      };
      customerWidget($('#retCust'), () => retCustId, id => { retCustId = id; });
      $$('input[data-k]', m).forEach(i => i.addEventListener('input', calc));
      const doReturn = useNow => {
        const total = calc();
        const items = [];
        $$('input[data-k]', m).forEach(inp => {
          const k = Number(inp.dataset.k); const q = Math.max(0, Math.min(parseInt(inp.value, 10) || 0, avail[k]));
          if (q > 0) items.push({ k, qty: q, name: s.items[k].name, value: round2(q * s.items[k].price * r) });
        });
        if (!items.length) { toast('Informe a quantidade a devolver.', 'error'); return; }
        items.forEach(it => { s.items[it.k].returned = (s.items[it.k].returned || 0) + it.qty; stockMove(getProduct(s.items[it.k].pid), it.qty, 'devolução', s.id); });
        const v = { code: genVoucherCode(), amount: total, balance: total, createdAt: new Date().toISOString(), saleId: s.id, saleNumber: s.number, saleNo: saleNo(s), items: items.map(i => ({ name: i.name, qty: i.qty, value: i.value })), uses: [], customer: custSnap(retCustId) };
        if (useNow && retCustId) DB.cart.customerId = retCustId;
        DB.vouchers.push(v);
        s.returns = s.returns || [];

          showPDV();

            body: `<div class="success-big"><div class="ic">🎟️</div><h3>${esc(v.code)}</h3><div class="change">${fmt(v.amount)}</div><p class="hint" style="margin-top:10px">O cliente pode usar este código no caixa (F8) em uma nova compra.</p></div>`,

            onOpen: mm => $('#vPrint', mm).addEventListener('click', () => printHTML(voucherReceiptHTML(v)))
          });
        }
      };
      $('#retOk').addEventListener('click', () => doReturn(false));
      $('#retUse').addEventListener('click', () => doReturn(true));
    }
  });

/* ---------- CONTROLE DE CAIXA ---------- */
function cashSummary(session) {
  const sales = DB.sales.filter(s => s.cashId === session.id && s.status !== 'cancelada');
  const byMethod = { dinheiro: 0, pix: 0, debito: 0, credito: 0, fiado: 0, vale: 0 };
  sales.forEach(s => { byMethod[s.payment.method] = (byMethod[s.payment.method] || 0) + s.total; if (s.voucher) byMethod.vale += s.voucher.amount; });
  Object.keys(byMethod).forEach(k => byMethod[k] = round2(byMethod[k]));
  const supr = round2(session.movements.filter(m => m.type === 'suprimento').reduce((a, m) => a + m.amount, 0));
  const sang = round2(session.movements.filter(m => m.type === 'sangria').reduce((a, m) => a + m.amount, 0));
  const totalSales = round2(sales.reduce((a, s) => a + s.gross, 0));
  const expectedCash = round2(session.openingAmount + byMethod.dinheiro + supr - sang);
  return { count: sales.length, byMethod, supr, sang, totalSales, expectedCash };
}

function openMovementModal(type) {
  const cash = currentCash(); if (!cash) return;

function generateSku(category, taken = new Set()) {
  const pre = SKU_PREFIX[category] || 'PRD';
  let n = 1, sku;
  do { sku = `${pre}-${pad(n, 4)}`; n++; } while (taken.has(sku) || DB.products.some(p => (p.sku || '').toUpperCase() === sku));
  return sku;
}
/* Acha o produto pelo código de barras OU pelo SKU (leitor ou digitação) */
function findByCode(term) {
  const t = String(term || '').trim(); if (!t) return null;
  const up = t.toUpperCase();
  return DB.products.find(p => p.code && p.code === t) || DB.products.find(p => p.sku && p.sku.toUpperCase() === up) || null;
}

let PHOTOS = {}; // pid -> { data, at }
async function loadPhotos() {
  if (!idb) return;
  try { const keys = await idbKeys('photos'); for (const k of keys) PHOTOS[k] = await idbGet('photos', k); }
  catch (e) { console.error('Fotos', e); }
}
const photoOf = p => (p && PHOTOS[p.id] && PHOTOS[p.id].data) || '';
function prodVisual(p) { const ph = photoOf(p); return ph ? `<img class="pimg" src="${ph}" alt="">` : (p.emoji || CAT_EMOJI[p.category] || '🎁'); }
function queuePhoto(pid) {
  if (!syncCfg || !syncCfg.url) return;
  syncCfg.photoQueue = [...new Set([...(syncCfg.photoQueue || []), pid])];
  saveSyncCfg();
}
async function setPhoto(p, data) {
  const at = new Date().toISOString();
  if (data) { PHOTOS[p.id] = { data, at }; if (idb) await idbPut('photos', p.id, PHOTOS[p.id]); }
  else { delete PHOTOS[p.id]; if (idb) await idbDel('photos', p.id).catch(() => { }); }
  p.photoAt = at; p.hasPhoto = !!data; p.updatedAt = at;
  queuePhoto(p.id);
}
async function restorePhotos(obj) {
  if (!obj || typeof obj !== 'object') return;
  for (const [pid, v] of Object.entries(obj)) { if (v && v.data) { PHOTOS[pid] = v; if (idb) await idbPut('photos', pid, v).catch(() => { }); } }
}
/* Reduz a foto para no máx. 480 px e JPEG ~75% (fica com uns 20–40 KB) */
function compressImage(file, max = 480, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato de imagem não suportado.'));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Sincroniza fotos com a tabela pdv_fotos (separada, para não pesar a sincronização das vendas) */
let photoSyncNote = '';
async function syncPhotos() {
  if (!syncEnabled()) return;
  try {
    const q = (syncCfg.photoQueue || []).filter(pid => DB.products.some(p => p.id === pid) || !PHOTOS[pid]);
    for (const pid of q) {
      const p = getProduct(pid);
      await sbFetch(`/rest/v1/pdv_fotos?on_conflict=dono,pid`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ dono: syncCfg.userId, pid, foto: (PHOTOS[pid] && PHOTOS[pid].data) || null, atualizado_em: (p && p.photoAt) || new Date().toISOString() }) });
      syncCfg.photoQueue = (syncCfg.photoQueue || []).filter(x => x !== pid);
    }
    if (q.length) await saveSyncCfg();
    // baixa fotos novas/alteradas em outros caixas
    const need = DB.products.filter(p => p.photoAt && p.hasPhoto && (!PHOTOS[p.id] || PHOTOS[p.id].at < p.photoAt)).map(p => p.id);
    for (let i = 0; i < need.length; i += 15) {
      const ids = need.slice(i, i + 15).map(x => `"${x}"`).join(',');
      const rows = await sbFetch(`/rest/v1/pdv_fotos?select=pid,foto,atualizado_em&dono=eq.${syncCfg.userId}&pid=in.(${encodeURIComponent(ids)})`, { method: 'GET' });
      for (const r of rows || []) if (r.foto) { const p = getProduct(r.pid); PHOTOS[r.pid] = { data: r.foto, at: (p && p.photoAt) || r.atualizado_em }; if (idb) await idbPut('photos', r.pid, PHOTOS[r.pid]); }
    }
    // fotos removidas em outro caixa
    for (const p of DB.products) if (p.photoAt && !p.hasPhoto && PHOTOS[p.id] && PHOTOS[p.id].at < p.photoAt) { delete PHOTOS[p.id]; if (idb) await idbDel('photos', p.id).catch(() => { }); }
    photoSyncNote = '';
  } catch (e) {
    console.error('Fotos sync', e);
    photoSyncNote = /pdv_fotos|PGRST205|schema cache|does not exist/i.test(String(e.message) + (e.code || '')) ? 'Para sincronizar as fotos, rode de novo o script SQL do passo 2 (ele cria a tabela de fotos).' : '';
  }
}

/* ---------- Código de barras (JsBarcode embutido) ---------- */
function isValidEan13(c) { return /^\d{13}$/.test(c) && ean13(c.slice(0, 12)) === c; }
function barcodeSVG(value, opts = {}) {
  if (!value || typeof JsBarcode === 'undefined') return '';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try {
    JsBarcode(svg, value, Object.assign({ format: isValidEan13(value) ? 'EAN13' : 'CODE128', width: 2, height: 40, displayValue: true, fontSize: 14, margin: 0, textMargin: 1, background: 'transparent' }, opts));
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    return svg.outerHTML;
  } catch (e) { return ''; }
}

const getCustomer = id => id ? DB.customers.find(c => c.id === id) || null : null;
function custSnap(id) { const c = getCustomer(id); return c ? { id: c.id, name: c.name, phone: c.phone || '' } : null; }
const onlyDigits = v => String(v || '').replace(/\D/g, '');
function fmtPhone(p) {
  const d = onlyDigits(p);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return d;
}
/* Aniversário: aceita "dd/mm" ou "dd/mm/aaaa" e guarda "MM-DD" */
function parseBirthday(v) {
  const m = String(v || '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if (!m) return null;
  const d = +m[1], mo = +m[2];
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return { bday: pad(mo, 2) + '-' + pad(d, 2), bdayYear: m[3] ? (m[3].length === 2 ? 1900 + +m[3] + (+m[3] < 30 ? 100 : 0) : +m[3]) : null };
}
const fmtBirthday = c => c && c.bday ? c.bday.slice(3) + '/' + c.bday.slice(0, 2) + (c.bdayYear ? '/' + c.bdayYear : '') : '';
function waLink(phone, msg) {
  let d = onlyDigits(phone);
  if (!d) return '';
  if (d.length <= 11) d = '55' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
}
const firstName = n => String(n || '').trim().split(/\s+/)[0];
function customerStats() {
  const st = {};
  DB.sales.forEach(s => {
    if (!s.customer || s.status === 'cancelada') return;
    const o = st[s.customer.id] = st[s.customer.id] || { count: 0, total: 0, last: null };
    o.count++; o.total += saleNet(s).revenue;
    if (!o.last || s.date > o.last) o.last = s.date;
  });
  return st;
}
function saveCustomer(data, existing) {
  if (existing) { Object.assign(existing, data, { updatedAt: new Date().toISOString() }); saveDB(); return existing; }
  const c = { id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), ...data };
  DB.customers.push(c); saveDB(); return c;
}

    };

    const openNew = () => {
      const v = inp.value.trim(), isPhone = /^[\d\s()+.-]+$/.test(v);
      nw.classList.remove('hidden'); res.innerHTML = '';
      box.querySelector('.cw-name').value = isPhone ? '' : v;
      box.querySelector('.cw-phone').value = isPhone ? v : '';
      (isPhone || !v ? box.querySelector('.cw-name') : box.querySelector('.cw-phone')).focus();
    };

/* ---------- Datas comemorativas ---------- */
function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
const nthWeekday = (y, month, weekday, n) => { const d = new Date(y, month, 1); while (d.getDay() !== weekday) d.setDate(d.getDate() + 1); d.setDate(d.getDate() + 7 * (n - 1)); return d; };
function commemorativeDates(y) {
  const bf = nthWeekday(y, 10, 4, 4); bf.setDate(bf.getDate() + 1);
  return [
    { key: 'mulher', name: 'Dia da Mulher', emoji: '🌷', date: new Date(y, 2, 8) },
    { key: 'pascoa', name: 'Páscoa', emoji: '🐰', date: easterDate(y) },
    { key: 'maes', name: 'Dia das Mães', emoji: '💐', date: nthWeekday(y, 4, 0, 2) },
    { key: 'namorados', name: 'Dia dos Namorados', emoji: '💘', date: new Date(y, 5, 12) },
    { key: 'avos', name: 'Dia dos Avós', emoji: '👵', date: new Date(y, 6, 26) },
    { key: 'pais', name: 'Dia dos Pais', emoji: '👔', date: nthWeekday(y, 7, 0, 2) },
    { key: 'criancas', name: 'Dia das Crianças', emoji: '🧸', date: new Date(y, 9, 12) },
    { key: 'professor', name: 'Dia do Professor', emoji: '🍎', date: new Date(y, 9, 15) },
    { key: 'blackfriday', name: 'Black Friday', emoji: '🛍️', date: bf },
    { key: 'natal', name: 'Natal', emoji: '🎄', date: new Date(y, 11, 25) }
  ];
}
const DATE_WINDOW_DAYS = 21; // compras feitas até 21 dias antes da data contam como "presente para a data"
function upcomingDates(daysAhead = 120) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const lim = new Date(today); lim.setDate(lim.getDate() + daysAhead);
  const y = today.getFullYear();
  return [...commemorativeDates(y), ...commemorativeDates(y + 1)].filter(d => d.date >= today && d.date <= lim).sort((a, b) => a.date - b.date);
}
/* Clientes que compraram perto dessa data em anos anteriores */
function buyersForDate(key, beforeYear) {
  const out = new Map();
  const years = [...new Set(DB.sales.map(s => new Date(s.date).getFullYear()))];
  years.forEach(y => {
    const occ = commemorativeDates(y).find(d => d.key === key); if (!occ) return;
    const end = new Date(occ.date); end.setHours(23, 59, 59);
    const start = new Date(occ.date); start.setDate(start.getDate() - DATE_WINDOW_DAYS);
    if (end >= new Date()) return; // só ocorrências que já passaram
    DB.sales.forEach(s => {
      if (!s.customer || s.status === 'cancelada') return;
      const d = new Date(s.date); if (d < start || d > end) return;
      const o = out.get(s.customer.id) || { customer: getCustomer(s.customer.id) || s.customer, items: [], years: new Set(), total: 0 };
      s.items.forEach(i => o.items.push(i.name)); o.years.add(y); o.total += saleNet(s).revenue;
      out.set(s.customer.id, o);
    });
  });
  return [...out.values()].sort((a, b) => b.total - a.total);
}
function upcomingBirthdays(days = 30) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return DB.customers.filter(c => c.bday).map(c => {
    const [mm, dd] = c.bday.split('-').map(Number);
    let d = new Date(today.getFullYear(), mm - 1, dd); if (d < today) d = new Date(today.getFullYear() + 1, mm - 1, dd);
    return { c, d, left: Math.round((d - today) / 86400000) };
  }).filter(x => x.left <= days).sort((a, b) => a.left - b.left);
}

function exportCustomersCSV() {
  const st = customerStats();

    confirmModal(`Excluir o usuário <b>${esc(u.name || u.username)}</b>?`, () => {
      DB.users = DB.users.filter(x => x.id !== u.id); DB.deleted.push(u.id); saveDB(); renderAdmin(); toast('Usuário excluído.', 'warn');

/* Criar/editar usuário. Funcionário editando a si mesmo: só troca a própria senha. */
function openUserModal(u) {
  const isNew = !u, self = u && u.id === currentUser.id, adminEditing = isAdmin();
  if (!adminEditing && !self) return;
  const perms = (u && u.perms) || { vendas: true };
  openModal({
    title: isNew ? '＋ Novo usuário' : self ? '👤 Minha conta' : '✏️ Editar usuário', size: 'lg',
    body: `${adminEditing ? `<div class="grid-2">
        <div class="field"><label>Nome</label><input class="input" id="ufName" value="${esc(u ? u.name : '')}" placeholder="Ex.: Maria" autofocus></div>
        <div class="field"><label>Nome de usuário (login)</label><input class="input" id="ufUser" value="${esc(u ? u.username : '')}" autocapitalize="none" autocomplete="off" placeholder="Ex.: maria"></div>
      </div>` : `<p style="margin-bottom:12px">Usuário: <b>${esc(u.username)}</b></p>`}
      ${self && !isNew ? `<div class="field"><label>Senha atual</label><input class="input" id="ufCur" type="password" autocomplete="off" ${adminEditing ? '' : 'autofocus'}></div>` : ''}
      <div class="grid-2">
        <div class="field"><label>${isNew ? 'Senha' : 'Nova senha'}</label><input class="input" id="ufPass" type="password" autocomplete="new-password" placeholder="${isNew ? 'Mínimo 4 caracteres' : 'Deixe em branco para manter'}"></div>
        <div class="field"><label>Repita a senha</label><input class="input" id="ufPass2" type="password" autocomplete="new-password"></div>
      </div>
      ${adminEditing ? `<div class="grid-2">
        <div class="field"><label>Perfil</label><select class="select" id="ufRole"><option value="user" ${u && u.role === 'admin' ? '' : 'selected'}>Funcionário (acessos escolhidos abaixo)</option><option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>👑 Administrador (acesso total)</option></select></div>
        <div class="field"><label>Situação</label><label class="check" style="margin-top:8px"><input type="checkbox" id="ufActive" ${!u || u.active ? 'checked' : ''} ${self ? 'disabled' : ''}> Usuário ativo (pode entrar)</label></div>
      </div>
      <div id="ufPermsBox"><label style="font-size:13px;font-weight:700;color:var(--ink-2)">O que este usuário pode acessar no Painel:</label>
        <div class="perm-list">${PERMS.map(p => `<label><input type="checkbox" data-perm="${p[0]}" ${perms[p[0]] ? 'checked' : ''}> ${p[1]}</label>`).join('')}</div>
        <p class="hint" style="margin-top:8px">Qualquer usuário pode vender no caixa. Sem nenhum acesso marcado, a pessoa não entra no Painel.</p></div>` : ''}`,
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="ufSave">💾 Salvar (Enter)</button>`,
    onOpen: m => {
      const syncRole = () => { const b = $('#ufPermsBox'); if (b) b.style.display = $('#ufRole').value === 'admin' ? 'none' : ''; };
      if ($('#ufRole')) { $('#ufRole').addEventListener('change', syncRole); syncRole(); }
      $('#ufSave', m).addEventListener('click', () => {
        const pass = $('#ufPass').value, pass2 = $('#ufPass2').value;
        if (self && !isNew && pass && u.hash !== hashPassword($('#ufCur').value, u.salt)) { toast('Senha atual incorreta.', 'error'); $('#ufCur').focus(); return; }
        if ((isNew || pass) && pass.length < 4) { toast('A senha precisa ter pelo menos 4 caracteres.', 'error'); $('#ufPass').focus(); return; }
        if (pass !== pass2) { toast('As senhas não conferem.', 'error'); $('#ufPass2').focus(); return; }
        let data = {};
        if (adminEditing) {
          const username = $('#ufUser').value.trim(), name = $('#ufName').value.trim(), role = $('#ufRole').value;
          if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) { toast('Nome de usuário: 3 a 30 letras ou números, sem espaços.', 'error'); $('#ufUser').focus(); return; }
          const dup = findUser(username); if (dup && (!u || dup.id !== u.id)) { toast('Já existe um usuário com esse nome.', 'error'); $('#ufUser').focus(); return; }
          const active = self ? true : $('#ufActive').checked;
          if (u && u.role === 'admin' && (role !== 'admin' || !active) && DB.users.filter(x => x.role === 'admin' && x.active && x.id !== u.id).length === 0) { toast('Precisa existir pelo menos um administrador ativo.', 'error'); return; }
          const p = {}; $$('[data-perm]', m).forEach(c => { if (c.checked) p[c.dataset.perm] = true; });
          data = { name: name || username, username, role, active, perms: p };
        }
        if (isNew) DB.users.push(makeUser({ ...data, password: pass }));
        else {
          Object.assign(u, data, { updatedAt: new Date().toISOString() });
          if (pass) { u.salt = uid(); u.hash = hashPassword(pass, u.salt); u.defaultPass = false; }
          if (self) currentUser = u;
        }
        saveDB(); closeModal(); renderAdmin(); toast(isNew ? 'Usuário criado!' : 'Dados salvos!', 'success');
      });
    }
  });
}

/* =========================================================
   SINCRONIZAÇÃO NA NUVEM (opcional) — Supabase
   Funciona "offline primeiro": tudo é salvo antes neste computador.
   Com internet, envia para a nuvem. Sem internet, fica na fila
   (marcado como pendente) e é enviado sozinho quando a conexão voltar.
   A configuração/login fica só neste computador e NUNCA vai no backup.
   ========================================================= */
const SYNC_TABLE = 'pdv_dados';
const SYNC_SQL = `create table if not exists public.pdv_dados (
  dono uuid primary key default auth.uid() references auth.users(id) on delete cascade,
  dados jsonb not null,
  atualizado_em timestamptz not null default now(),
  aparelho text
);
alter table public.pdv_dados enable row level security;
drop policy if exists "Somente o dono acessa" on public.pdv_dados;
create policy "Somente o dono acessa" on public.pdv_dados
  for all to authenticated
  using (auth.uid() = dono) with check (auth.uid() = dono);
grant select, insert, update, delete on public.pdv_dados to authenticated;

-- fotos dos produtos (tabela separada, para a sincronização das vendas continuar leve)
create table if not exists public.pdv_fotos (
  dono uuid not null default auth.uid() references auth.users(id) on delete cascade,
  pid text not null,
  foto text,
  atualizado_em timestamptz not null default now(),
  primary key (dono, pid)
);
alter table public.pdv_fotos enable row level security;
drop policy if exists "Somente o dono acessa fotos" on public.pdv_fotos;
create policy "Somente o dono acessa fotos" on public.pdv_fotos
  for all to authenticated
  using (auth.uid() = dono) with check (auth.uid() = dono);
grant select, insert, update, delete on public.pdv_fotos to authenticated;`;
let syncCfg = null, syncBusy = false, syncTimer = null, syncStatus = 'off', syncError = '', syncCfgTimer = null;

async function loadSyncCfg() {
  try { const raw = idb ? await idbGet('kv', 'sync') : localStorage.getItem(LS_KEY + '_sync'); syncCfg = raw ? JSON.parse(raw) : null; }
  catch (e) { syncCfg = null; }
  if (syncCfg && syncCfg.url && !syncCfg.caixa) { syncCfg.caixa = 'CX1'; saveSyncCfg(); }
}
async function saveSyncCfg() {
  if (!syncCfg) return;
  const j = JSON.stringify(syncCfg);
  try { if (idb) await idbPut('kv', 'sync', j); else localStorage.setItem(LS_KEY + '_sync', j); } catch (e) { console.error(e); }
}
async function clearSyncCfg() {
  // mantém só a identificação do caixa (numeração e caixa aberto continuam iguais)
  syncCfg = syncCfg && syncCfg.caixa ? { caixa: syncCfg.caixa, device: syncCfg.device } : null;
  try { if (syncCfg) await saveSyncCfg(); else { if (idb) await idbDel('kv', 'sync'); localStorage.removeItem(LS_KEY + '_sync'); } } catch (e) { }
}
const syncEnabled = () => !!(syncCfg && syncCfg.url && syncCfg.anonKey && syncCfg.refreshToken);

function markSyncPending() {
  if (!syncEnabled() || syncCfg.applying) return;
  syncCfg.pending = true;
  clearTimeout(syncCfgTimer); syncCfgTimer = setTimeout(saveSyncCfg, 500);
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), 4000);
  if (syncStatus !== 'syncing') setSyncStatus(navigator.onLine ? 'pending' : 'offline');
}
function setSyncStatus(st) {
  syncStatus = st;
  const b = $('#cloudStatus');
  if (b) {
    if (!syncEnabled()) b.classList.add('hidden');
    else {
      const last = syncCfg.lastSyncAt ? new Date(syncCfg.lastSyncAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
      const map = { ok: ['ok', `☁️ Nuvem em dia ${last}`], pending: ['pending', '⏳ Enviando à nuvem...'], syncing: ['pending', '🔄 Sincronizando...'], offline: ['offline', '📴 Sem internet • envia depois'], error: ['error', '⚠️ Erro na nuvem'] };
      const [cls, txt] = map[st] || map.ok;
      b.className = 'btn-admin btn-cloud ' + cls; b.textContent = txt;
      b.title = st === 'error' ? 'Erro: ' + syncError : 'Última sincronização: ' + (syncCfg.lastSyncAt ? fmtDateTime(syncCfg.lastSyncAt) : 'nunca');
    }
  }
  const box = $('#syncStatusBox'); if (box) box.innerHTML = syncStatusHTML();
}
function syncStatusHTML() {
  if (!syncEnabled()) return '<span class="badge b-gray">Desligada — o sistema funciona só neste computador</span>';
  const lbl = { ok: '<span class="badge b-green">✅ Tudo sincronizado</span>', pending: '<span class="badge b-amber">⏳ Alterações aguardando envio</span>', syncing: '<span class="badge b-blue">🔄 Sincronizando...</span>', offline: '<span class="badge b-amber">📴 Sem internet — as alterações ficam guardadas e serão enviadas quando a internet voltar</span>', error: `<span class="badge b-red">⚠️ ${esc(syncError || 'Erro')}</span>` }[syncStatus] || '';
  return `${lbl}${photoSyncNote ? `<div class="badge b-amber" style="margin-top:6px">📷 ${esc(photoSyncNote)}</div>` : ''}<div class="hint" style="margin-top:8px">Conta: <b>${esc(syncCfg.email || '')}</b> • Este caixa: <b>${esc(myCaixa())}</b> • Última sincronização: <b>${syncCfg.lastSyncAt ? fmtDateTime(syncCfg.lastSyncAt) : 'nunca'}</b></div>`;
}

async function sbFetch(path, opts = {}, auth = true) {
  const headers = Object.assign({ apikey: syncCfg.anonKey, 'Content-Type': 'application/json' }, opts.headers || {});
  if (auth) headers.Authorization = 'Bearer ' + await getAccessToken();
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch(syncCfg.url + path, { ...opts, headers, signal: ctrl.signal });
    const txt = await r.text(); let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = txt; }
    if (!r.ok) {
      const err = new Error((body && (body.error_description || body.msg || body.message || body.error)) || ('HTTP ' + r.status));
      err.status = r.status; err.code = body && body.code; throw err;
    }
    return body;
  } finally { clearTimeout(t); }
}
function friendlyError(e) {
  const m = String(e && e.message || e);
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. No Supabase, marque "Auto Confirm User" ao criar o usuário.';
  if (/pdv_dados|PGRST205|does not exist|schema cache/i.test(m) || (e && e.code === 'PGRST205')) return 'Tabela não encontrada. Rode o script SQL do passo 2.';
  if (/invalid api key|no api key/i.test(m)) return 'Chave (anon/publishable) inválida. Confira o passo 4.';
  if (/refresh token/i.test(m)) return 'Sessão expirada. Desconecte e conecte novamente.';
  if (e && e.name === 'AbortError') return 'A nuvem demorou para responder. Tentaremos de novo.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return navigator.onLine ? 'Não foi possível acessar a nuvem (o projeto Supabase pode estar pausado ou o endereço está errado).' : 'Sem internet.';
  return m;
}
function applySession(b) {
  syncCfg.accessToken = b.access_token; syncCfg.refreshToken = b.refresh_token;
  syncCfg.expiresAt = Date.now() + (b.expires_in || 3600) * 1000;
  if (b.user) { syncCfg.userId = b.user.id; syncCfg.email = b.user.email; }
}
async function getAccessToken() {
  if (syncCfg.accessToken && Date.now() < syncCfg.expiresAt - 60000) return syncCfg.accessToken;
  const body = await sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: syncCfg.refreshToken }) }, false);
  applySession(body); await saveSyncCfg();
  return syncCfg.accessToken;
}
async function pullRemote() {
  const rows = await sbFetch(`/rest/v1/${SYNC_TABLE}?select=dados,atualizado_em,aparelho&dono=eq.${syncCfg.userId}`, { method: 'GET' });
  return Array.isArray(rows) && rows[0] ? rows[0] : null;
}
function cloudPayload() { const d = JSON.parse(JSON.stringify(DB)); d.cart = emptyCart(); delete d.backup; return d; }
async function pushRemote() {
  const now = new Date().toISOString();
  const rows = await sbFetch(`/rest/v1/${SYNC_TABLE}?on_conflict=dono`, {
    method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ dono: syncCfg.userId, dados: cloudPayload(), atualizado_em: now, aparelho: syncCfg.device })
  });
  return Array.isArray(rows) && rows[0] ? rows[0].atualizado_em : now;
}
/* Junta os dados da nuvem com os deste computador (nada é apagado sem motivo) */
function mergeRemote(remote) {
  const r = normalizeDB(remote);
  const tomb = new Set([...(DB.deleted || []), ...(r.deleted || [])]);
  DB.deleted = [...tomb];
  const mergeArr = (key, idOf, remoteWins) => {
    const map = new Map();
    r[key].forEach(x => map.set(idOf(x), x));
    DB[key].forEach(x => { const k = idOf(x), rx = map.get(k); map.set(k, rx && remoteWins(x, rx) ? rx : x); });
    DB[key] = [...map.values()].filter(x => !tomb.has(idOf(x)));
  };
  mergeArr('products', x => x.id, (l, rm) => (rm.updatedAt || rm.createdAt || '') > (l.updatedAt || l.createdAt || ''));
  mergeArr('sales', x => x.id, (l, rm) => (rm.status === 'cancelada' && l.status !== 'cancelada') || (rm.returns || []).length > (l.returns || []).length);
  mergeArr('vouchers', x => x.code, (l, rm) => false);
  // utilizações de vale vindas de qualquer caixa são somadas
  const rv = new Map(r.vouchers.map(v => [v.code, v]));
  DB.vouchers.forEach(v => { const o = rv.get(v.code); if (!o) return; const uses = new Map(); [...(o.uses || []), ...(v.uses || [])].forEach(u => uses.set(u.saleId, u)); v.uses = [...uses.values()]; });
  // livro de estoque: junta os lançamentos de todos os caixas e recalcula
  const mv = new Map(); [...r.stockMoves, ...DB.stockMoves].forEach(m => mv.set(m.id, m)); DB.stockMoves = [...mv.values()];
  DB.caixas = Object.assign({}, r.caixas, DB.caixas);
  mergeArr('customers', x => x.id, (l, rm) => (rm.updatedAt || '') > (l.updatedAt || ''));
  mergeArr('categories', x => x.id, (l, rm) => (rm.updatedAt || '') > (l.updatedAt || ''));
  ['suppliers', 'purchases', 'bills', 'recurring'].forEach(k => mergeArr(k, x => x.id, (l, rm) => (rm.updatedAt || '') > (l.updatedAt || '')));
  mergeArr('users', x => x.id, (l, rm) => (rm.updatedAt || '') > (l.updatedAt || ''));
  if (currentUser) currentUser = DB.users.find(u => u.id === currentUser.id) || null;
  mergeArr('cashSessions', x => x.id, (l, rm) => (!!rm.closedAt && !l.closedAt) || (rm.movements || []).length > (l.movements || []).length);
  DB.sales.sort((a, b) => new Date(a.date) - new Date(b.date));
  DB.cashSessions.sort((a, b) => new Date(a.openedAt) - new Date(b.openedAt));
  DB.counters.sale = Math.max(DB.counters.sale || 0, r.counters.sale || 0);
  recomputeStock();
  recomputeVouchers();
  refreshCategories(DB);
  ensureRecurring();
}
async function applyLocal(fn) { syncCfg.applying = true; try { fn(); await writeNow(); } finally { syncCfg.applying = false; } }
function refreshScreens() { if (modalState) return; mode === 'pdv' ? renderPDV() : renderAdmin(); }

async function syncNow(manual = false) {
  if (!syncEnabled() || syncBusy) return;
  clearTimeout(syncTimer);
  if (!navigator.onLine) { setSyncStatus('offline'); if (manual) toast('Sem internet. As alterações ficam guardadas e serão enviadas quando a internet voltar.', 'warn', 5000); return; }
  syncBusy = true; setSyncStatus('syncing');
  let pushing = false, changed = false;
  try {
    const remote = await pullRemote();
    if (remote && new Date(remote.atualizado_em).getTime() > (syncCfg.lastRemoteAt || 0)) {
      await applyLocal(() => mergeRemote(remote.dados));
      changed = true;
      syncCfg.lastRemoteAt = new Date(remote.atualizado_em).getTime();
    }
    if (syncCfg.pending || !remote) { // só envia se este computador tiver alterações novas (evita vai-e-volta)
      pushing = true; syncCfg.pending = false;
      const at = await pushRemote();
      syncCfg.lastRemoteAt = new Date(at).getTime();
      pushing = false;
    }
    await syncPhotos();
    if (changed) refreshScreens();
    syncCfg.lastSyncAt = Date.now(); syncError = '';
    await saveSyncCfg();
    setSyncStatus(syncCfg.pending ? 'pending' : 'ok');
    if (changed) refreshScreens();
    if (manual) toast('Sincronizado com a nuvem! ☁️', 'success');
    if (syncCfg.pending) syncTimer = setTimeout(() => syncNow(), 4000);
  } catch (e) {
    console.error('Sync', e);
    if (pushing) syncCfg.pending = true;
    syncError = friendlyError(e);
    await saveSyncCfg();
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
    if (manual) toast('Nuvem: ' + syncError, 'error', 6000);
    if (/refresh token|sessão expirada/i.test(syncError)) return;
    syncTimer = setTimeout(() => syncNow(), 60000); // tenta de novo em 1 minuto
  } finally { syncBusy = false; }
}

async function connectCloud(url, anonKey, email, password, caixa) {
  url = url.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  if (!/^https:\/\/.+/.test(url)) throw new Error('O endereço do projeto deve começar com https://');
  const device = (syncCfg && syncCfg.device) || ('Caixa-' + Math.random().toString(36).slice(2, 6).toUpperCase());
  const prev = syncCfg;
  syncCfg = { url, anonKey: anonKey.trim(), device, pending: true, lastRemoteAt: 0, caixa: (caixa || 'CX1').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) || 'CX1' };
  try {
    const body = await sbFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: email.trim(), password }) }, false);
    applySession(body);
    const remote = await pullRemote(); // também confere se a tabela existe
    // nome de caixa já usado por outro computador? escolhe o próximo livre
    const reg = Object.assign({}, remote && remote.dados && remote.dados.caixas, DB.caixas);
    if (reg[syncCfg.caixa] && reg[syncCfg.caixa] !== device) {
      let n = 1; while (reg['CX' + n] && reg['CX' + n] !== device) n++;
      toast(`O nome ${syncCfg.caixa} já é usado por outro computador. Este será o caixa CX${n}.`, 'warn', 6000);
      syncCfg.caixa = 'CX' + n;
    }
    await saveSyncCfg();
    return remote;

/* =========================================================
   FINANCEIRO: taxas da maquininha, fornecedores, compras,
   contas a pagar / a receber (fiado, recorrentes) e DRE.
   ========================================================= */
const DEFAULT_FEES = { debito: 1.99, pix: 0, credito: [4.99, 6.49, 7.19, 7.89, 8.59, 9.29, 9.99, 10.69, 11.39, 12.09, 12.79, 13.49] };
const MERCH_CAT = 'Mercadorias (fornecedor)';
const FIADO_CAT = 'Fiado (venda a prazo)';
const EXPENSE_CATS = ['Aluguel', 'Energia', 'Água', 'Internet e telefone', 'Salários e encargos', 'Pró-labore', 'Impostos', 'Contador', 'Marketing e anúncios', 'Embalagens e material', 'Manutenção', 'Sistemas e assinaturas', 'Tarifas bancárias', 'Outras despesas', MERCH_CAT];
const INCOME_CATS = [FIADO_CAT, 'Outras receitas'];
const BILL_METHODS = { dinheiro: '💵 Dinheiro', pix: '⚡ Pix', debito: '💳 Débito', credito: '💳 Crédito', boleto: '📄 Boleto', transferencia: '🏦 Transferência' };

const feesCfg = () => { const f = DB.settings.fees || {}; return { debito: f.debito ?? DEFAULT_FEES.debito, pix: f.pix ?? DEFAULT_FEES.pix, credito: Array.isArray(f.credito) && f.credito.length === 12 ? f.credito : DEFAULT_FEES.credito }; };
function feeRate(method, inst = 1) {
  const f = feesCfg();
  if (method === 'debito') return +f.debito || 0;
  if (method === 'pix') return +f.pix || 0;
  if (method === 'credito') return +f.credito[Math.min(12, Math.max(1, inst || 1)) - 1] || 0;
  return 0;
}
/* Taxa de uma venda: usa a taxa gravada na hora da venda; vendas antigas usam a tabela atual */
function saleFee(s) {
  if (s.status === 'cancelada' || !(s.total > 0)) return 0;
  if (typeof s.fee === 'number') return s.fee;
  return round2(s.total * feeRate(s.payment.method, s.payment.installments) / 100);
}

/* ---------- datas (AAAA-MM-DD, horário local) ---------- */
const todayISO = () => dayKey();
const isoOf = d => dayKey(new Date(d));
const addDaysISO = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
function addMonthsISO(iso, n) {
  const d = new Date(iso + 'T12:00:00'), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return dayKey(d);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const fmtISO = iso => iso ? iso.split('-').reverse().join('/') : '—';
const monthStartISO = (iso = todayISO()) => iso.slice(0, 7) + '-01';
const monthEndISO = (iso = todayISO()) => addDaysISO(addMonthsISO(monthStartISO(iso), 1), -1);
const monthLabel = iso => new Date(iso.slice(0, 7) + '-15T12:00:00').toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });

/* ---------- contas ---------- */
function billStatus(b) { if (b.status === 'cancelada') return 'cancelada'; if (b.paidAt) return 'paga'; return b.due < todayISO() ? 'vencida' : 'aberta'; }
const billValue = b => b.paidAt ? (b.paidAmount ?? b.amount) : b.amount;
const getSupplier = id => DB.suppliers.find(s => s.id === id);
function newBill(data) {
  const now = new Date().toISOString();
  const b = { id: uid(), type: 'pagar', desc: '', category: 'Outras despesas', amount: 0, due: todayISO(), status: 'aberta', paidAt: null, createdAt: now, updatedAt: now, by: currentUser ? (currentUser.name || currentUser.username) : '', ...data };
  b.amount = round2(b.amount);
  DB.bills.push(b); return b;
}
function splitAmount(total, n) { const base = Math.floor(total / n * 100) / 100; const arr = Array(n).fill(base); arr[n - 1] = round2(total - base * (n - 1)); return arr; }
/* Contas fixas mensais (aluguel, luz...): gera os lançamentos até o mês que vem.
   O id é fixo por mês, então dois caixas nunca criam a mesma conta duas vezes. */
function ensureRecurring() {
  if (!DB || !Array.isArray(DB.recurring)) return false;
  const tomb = new Set(DB.deleted || []), have = new Set(DB.bills.map(b => b.id));
  const limit = monthEndISO(addMonthsISO(todayISO(), 1));
  let changed = false;
  DB.recurring.forEach(r => {
    if (r.active === false && !r.end) return;
    for (let k = 0; k < 240; k++) {
      const due = addMonthsISO(r.start, k);
      if (due > limit || (r.end && due > r.end)) break;
      const id = 'rec-' + r.id + '-' + due.slice(0, 7);
      if (tomb.has(id) || have.has(id)) continue;
      const now = new Date().toISOString();
      DB.bills.push({ id, type: r.type || 'pagar', desc: r.desc, category: r.category, amount: r.amount, due, supplierId: r.supplierId || null, recurringId: r.id, status: 'aberta', paidAt: null, createdAt: now, updatedAt: now });
      have.add(id); changed = true;
    }
  });
  return changed;
}
/* Lança no caixa aberto (sangria ao pagar / suprimento ao receber) */
function cashMove(type, amount, reason) {
  const cash = currentCash(); if (!cash) return null;
  const mv = { id: uid(), type, amount: round2(amount), reason, date: new Date().toISOString() };
  cash.movements.push(mv); return { cashId: cash.id, moveId: mv.id };
}
function undoCashMove(ref) {
  if (!ref) return true;
  const c = DB.cashSessions.find(x => x.id === ref.cashId);
  if (!c || c.closedAt) return false;
  c.movements = c.movements.filter(m => m.id !== ref.moveId); return true;
}

/* ---------- vendas a prazo (fiado) ---------- */
function createFiadoBills(sale, n, firstDue) {
  const parts = splitAmount(sale.total, n);
  parts.forEach((v, i) => newBill({
    type: 'receber', desc: `Venda ${saleNo(sale)}${n > 1 ? ` • parcela ${i + 1}/${n}` : ''}`, category: FIADO_CAT, amount: v,
    due: addMonthsISO(firstDue, i), saleId: sale.id, customer: sale.customer, parcel: n > 1 ? `${i + 1}/${n}` : ''
  }));
}
const fiadoOpenFor = custId => DB.bills.filter(b => b.type === 'receber' && b.customer && b.customer.id === custId && !b.paidAt && b.status !== 'cancelada');

/* =========================================================
   CÁLCULO DO RESULTADO (DRE) E FLUXO DE CAIXA
   ========================================================= */
function finCompute(from, to) {
  const inR = iso => iso && iso >= from && iso <= to;
  const sales = DB.sales.filter(s => s.status !== 'cancelada' && inR(isoOf(s.date)));
  let gross = 0, discounts = 0, net = 0, cmv = 0, fees = 0, cashSales = 0, fiadoSales = 0;
  const feeBy = {};
  sales.forEach(s => {
    const n = saleNet(s), f = saleFee(s);
    gross += s.subtotal; discounts += s.subtotal - s.gross; net += n.revenue; cmv += n.cost; fees += f;
    if (f) feeBy[s.payment.method] = (feeBy[s.payment.method] || 0) + f;
    if (s.payment.method === 'fiado') fiadoSales += s.total; else cashSales += s.total - f;
  });
  const returns = gross - discounts - net;
  const live = DB.bills.filter(b => b.status !== 'cancelada');
  const expBills = live.filter(b => b.type === 'pagar' && b.category !== MERCH_CAT && inR(b.due));
  const expByCat = {};
  expBills.forEach(b => { expByCat[b.category] = (expByCat[b.category] || 0) + billValue(b); });
  const expenses = expBills.reduce((a, b) => a + billValue(b), 0);
  const otherIncome = live.filter(b => b.type === 'receber' && !b.saleId && inR(b.due)).reduce((a, b) => a + billValue(b), 0);
  const grossProfit = net - cmv;
  const result = grossProfit - fees - expenses + otherIncome;
  const mc = net > 0 ? (net - cmv - fees) / net : 0;
  // fluxo de caixa: o que realmente entrou e saiu (pela data do pagamento)
  const received = live.filter(b => b.type === 'receber' && inR(b.paidAt)).reduce((a, b) => a + billValue(b), 0);
  const paidOut = live.filter(b => b.type === 'pagar' && inR(b.paidAt));
  const paidMerch = paidOut.filter(b => b.category === MERCH_CAT).reduce((a, b) => a + billValue(b), 0);
  const paidExp = paidOut.filter(b => b.category !== MERCH_CAT).reduce((a, b) => a + billValue(b), 0);
  const cashIn = cashSales + received, cashOut = paidMerch + paidExp;
  const r2 = v => round2(v);
  return {
    sales: sales.length, gross: r2(gross), discounts: r2(discounts), returns: r2(returns), net: r2(net), cmv: r2(cmv), grossProfit: r2(grossProfit),
    fees: r2(fees), feeBy, expenses: r2(expenses), expByCat, otherIncome: r2(otherIncome), result: r2(result),
    margin: net > 0 ? result / net * 100 : 0, grossMargin: net > 0 ? grossProfit / net * 100 : 0, mc,
    breakEven: mc > 0 ? r2(expenses / mc) : null, ticket: sales.length ? net / sales.length : 0,
    cashSales: r2(cashSales), fiadoSales: r2(fiadoSales), received: r2(received), paidMerch: r2(paidMerch), paidExp: r2(paidExp),
    cashIn: r2(cashIn), cashOut: r2(cashOut), cashBalance: r2(cashIn - cashOut)
  };
}
function finRange() {
  const p = adminState.finPeriod || 'month', t = todayISO();
  if (p === 'month') return { from: monthStartISO(t), to: t, label: 'Este mês' };
  if (p === 'last') { const s = monthStartISO(addMonthsISO(monthStartISO(t), -1)); return { from: s, to: monthEndISO(s), label: 'Mês passado' }; }
  if (p === '3m') return { from: monthStartISO(addMonthsISO(monthStartISO(t), -2)), to: t, label: 'Últimos 3 meses' };
  if (p === 'year') return { from: t.slice(0, 4) + '-01-01', to: t, label: 'Este ano' };
  const from = adminState.finFrom || monthStartISO(t), to = adminState.finTo || t;
  return { from, to: to < from ? from : to, label: `${fmtISO(from)} a ${fmtISO(to < from ? from : to)}` };
}
const pctOf = (v, base) => base ? fmtNum(v / base * 100) + '%' : '—';
