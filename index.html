        <div class="v">${F.net === 0 && F.expenses === 0 ? 'Sem movimento no período' : profit ? `A loja teve LUCRO de ${fmt(F.result)}` : `A loja teve PREJUÍZO de ${fmt(-F.result)}`}</div>
        <div class="s">${F.net > 0 ? (profit ? `De cada R$ 100,00 vendidos, sobraram <b>${fmt(per100)}</b> de lucro.` : `As despesas, os custos e as taxas foram maiores que o que as vendas deixaram. De cada R$ 100,00 vendidos, faltaram <b>${fmt(-per100)}</b>.`) : 'Ainda não há vendas neste período.'}</div>
      </div>
    </div>
    ${noExpenses ? `<div class="info-box" style="margin-bottom:16px">💡 Para o lucro ficar real, cadastre as despesas da loja (aluguel, luz, salários...) em <a href="#" id="goPagar"><b>Contas a pagar</b></a>. Dá para deixar como conta fixa mensal e ela se repete sozinha.</div>` : ''}
    <div class="kpis fin">
      <div class="kpi"><div class="k-l">Vendas (receita líquida)</div><div class="k-v">${fmt(F.net)}</div><div class="k-s">${F.sales} vendas • ticket ${fmt(F.ticket)}</div></div>
      <div class="kpi blue"><div class="k-l">Lucro bruto</div><div class="k-v">${fmt(F.grossProfit)}</div><div class="k-s">Margem bruta ${fmtNum(F.grossMargin)}%</div></div>
      <div class="kpi amber"><div class="k-l">Despesas + taxas</div><div class="k-v">${fmt(F.expenses + F.fees)}</div><div class="k-s">Taxas de cartão/Pix: ${fmt(F.fees)}</div></div>
      <div class="kpi ${profit ? 'green' : 'red'}"><div class="k-l">${profit ? 'Lucro líquido' : 'Prejuízo'}</div><div class="k-v">${fmt(F.result)}</div><div class="k-s">Margem líquida ${fmtNum(F.margin)}%</div></div>
      <div class="kpi ${F.cashBalance >= 0 ? 'green' : 'red'}"><div class="k-l">Saldo do caixa (entrou − saiu)</div><div class="k-v">${fmt(F.cashBalance)}</div><div class="k-s">Entrou ${fmt(F.cashIn)} • saiu ${fmt(F.cashOut)}</div></div>
    </div>
    <div class="charts">
      <div class="card"><h3>📈 Vendas × Custos e despesas × Resultado (últimos 6 meses)</h3><div class="chart-box"><canvas id="chFinMonths"></canvas></div></div>
      <div class="card"><h3>🍰 Para onde vai o dinheiro das vendas</h3><div class="chart-box"><canvas id="chFinWhere"></canvas></div></div>
    </div>
    <div class="charts-2">
      <div class="card"><h3>🧾 Demonstrativo de resultado (DRE)</h3>
        <table class="dre"><thead><tr><th></th><th class="r">Valor</th><th class="r">% das vendas</th></tr></thead><tbody>
          ${line('Vendas brutas (preço de tabela)', F.gross, '', F.net, '')}
          ${F.discounts ? line('(−) Descontos dados', F.discounts, 'neg', F.net, '−') : ''}
          ${F.returns ? line('(−) Trocas e devoluções', F.returns, 'neg', F.net, '−') : ''}
          ${line('= Receita líquida de vendas', F.net, 'sub')}
          ${line('(−) Custo das mercadorias vendidas (CMV)', F.cmv, 'neg', F.net, '−')}
          ${line('= Lucro bruto', F.grossProfit, 'sub', F.net, F.grossProfit < 0 ? '−' : '')}
          ${line('(−) Taxas da maquininha e Pix', F.fees, 'neg', F.net, '−')}
          ${expRows.length ? expRows.map(([c, v]) => line(`(−) ${esc(c)}`, v, 'neg', F.net, '−')).join('') : `<tr class="neg"><td>(−) Despesas da loja</td><td class="r mono">${fmt(0)}</td><td class="r hint">nenhuma cadastrada</td></tr>`}
          ${F.otherIncome ? line('(+) Outras receitas', F.otherIncome, '', F.net, '+') : ''}
          <tr class="total ${profit ? 'ok' : 'bad'}"><td>= ${profit ? 'LUCRO LÍQUIDO' : 'PREJUÍZO'}</td><td class="r mono">${profit ? '' : '−'}${fmt(Math.abs(F.result))}</td><td class="r mono">${pctOf(Math.abs(F.result), F.net)}</td></tr>
        </tbody></table>
        <p class="hint" style="margin-top:8px">As compras de mercadoria não entram aqui como despesa. Elas viram custo (CMV) quando o produto é vendido. As despesas contam pela data de vencimento.</p>
      </div>
      <div class="card"><h3>🎯 Indicadores</h3>
        <div class="fin-ind">
          <div><div class="l">Ponto de equilíbrio</div>
            <div class="v">${be ? fmt(be) : F.expenses > 0 ? 'Sem margem' : '—'}</div>
            <div class="hint">${be ? `É quanto precisa vender no período para pagar todas as despesas. Já vendeu ${fmtNum(F.net / be * 100)}%.` : F.expenses > 0 ? 'As vendas não estão deixando margem para cobrir as despesas.' : 'Cadastre as despesas para calcular.'}</div>
            <div class="progress"><div style="width:${beProg}%;background:${beProg >= 100 ? 'var(--green)' : 'var(--amber)'}"></div></div></div>
          <div><div class="l">Margem de contribuição</div><div class="v">${fmtNum(F.mc * 100)}%</div><div class="hint">Quanto sobra de cada venda depois do custo da mercadoria e das taxas, para pagar as despesas.</div></div>
          <div><div class="l">Fluxo de caixa no período</div><div class="v ${F.cashBalance >= 0 ? 'pos' : 'negv'}">${fmt(F.cashBalance)}</div>
            <div class="hint">Entradas: vendas recebidas ${fmt(F.cashSales)} (já sem taxas) + fiado recebido ${fmt(F.received)}.<br>Saídas: fornecedores ${fmt(F.paidMerch)} + despesas pagas ${fmt(F.paidExp)}.${F.fiadoSales ? `<br>Vendido no fiado (ainda a receber): ${fmt(F.fiadoSales)}.` : ''}</div></div>
          <div><div class="l">Estoque parado</div><div class="v">${fmt(stockCost)}</div><div class="hint">a preço de custo • vale ${fmt(stockPrice)} a preço de venda</div></div>
        </div>
      </div>
    </div>
    <div class="card"><h3>⏰ Contas que pedem atenção</h3>
      <div class="cash-grid">
        <div class="stat ${payLate.length ? 'bad' : ''}"><div class="l">📤 A pagar vencidas</div><div class="v">${fmt(sum(payLate))}</div><div class="hint">${payLate.length} conta(s)</div></div>
        <div class="stat"><div class="l">📤 A pagar nos próximos 7 dias</div><div class="v">${fmt(sum(pay7))}</div><div class="hint">${pay7.length} conta(s)</div></div>
        <div class="stat ${recLate.length ? 'bad' : ''}"><div class="l">📥 A receber atrasadas</div><div class="v">${fmt(sum(recLate))}</div><div class="hint">${recLate.length} conta(s)</div></div>
        <div class="stat"><div class="l">📥 Total a receber (fiado e outros)</div><div class="v">${fmt(sum(recOpen))}</div><div class="hint">${recOpen.length} conta(s) em aberto</div></div>
      </div>
    </div>`;

  $('#finPer').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { adminState.finPeriod = b.dataset.p; if (b.dataset.p === 'custom' && !adminState.finFrom) { adminState.finFrom = R.from; adminState.finTo = R.to; } renderAdmin(); } });
  if ($('#finFrom')) ['finFrom', 'finTo'].forEach(id => $('#' + id).addEventListener('change', () => { adminState.finFrom = $('#finFrom').value; adminState.finTo = $('#finTo').value; renderAdmin(); }));
  if ($('#goPagar')) $('#goPagar').addEventListener('click', e => { e.preventDefault(); adminState.finTab = 'pagar'; renderAdmin(); });
  $('#finCsv').addEventListener('click', () => {
    const rows = [['Demonstrativo de resultado', `${fmtISO(R.from)} a ${fmtISO(R.to)}`], [], ['Linha', 'Valor (R$)', '% das vendas']];
    const add = (l, v) => rows.push([l, round2(v), F.net ? round2(v / F.net * 100) : '']);
    add('Vendas brutas', F.gross); add('(-) Descontos', -F.discounts); add('(-) Trocas e devoluções', -F.returns); add('= Receita líquida', F.net);
    add('(-) CMV', -F.cmv); add('= Lucro bruto', F.grossProfit); add('(-) Taxas maquininha/Pix', -F.fees);
    Object.entries(F.expByCat).forEach(([c, v]) => add('(-) ' + c, -v)); add('(+) Outras receitas', F.otherIncome); add('= Resultado líquido', F.result);
    rows.push([], ['Fluxo de caixa'], ['Vendas recebidas (sem taxas)', F.cashSales], ['Fiado recebido', F.received], ['Pago a fornecedores', -F.paidMerch], ['Despesas pagas', -F.paidExp], ['Saldo', F.cashBalance]);
    downloadFile(`dre_${R.from}_${R.to}.csv`, toCSV(rows), 'text/csv;charset=utf-8');
  });

  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = '"Montserrat", "Segoe UI", system-ui, sans-serif';
  Chart.defaults.color = '#957a80';
  const months = [];
  for (let i = 5; i >= 0; i--) { const s = monthStartISO(addMonthsISO(monthStartISO(R.to), -i)); months.push({ s, e: monthEndISO(s) }); }
  const ms = months.map(m => finCompute(m.s, m.e));
  const moneyTick = { callback: v => 'R$ ' + Number(v).toLocaleString('pt-BR') };
  charts.push(new Chart($('#chFinMonths'), {
    data: {
      labels: months.map(m => monthLabel(m.s)),
      datasets: [
        { type: 'bar', order: 2, label: 'Vendas', data: ms.map(x => x.net), backgroundColor: '#e8a9b9', borderRadius: 6, maxBarThickness: 38 },
        { type: 'bar', order: 2, label: 'Custos + taxas + despesas', data: ms.map(x => round2(x.cmv + x.fees + x.expenses)), backgroundColor: '#b9846c', borderRadius: 6, maxBarThickness: 38 },
        { type: 'line', order: 1, label: 'Resultado', data: ms.map(x => x.result), borderColor: '#16a34a', backgroundColor: '#16a34a', tension: .3, pointRadius: 4, segment: { borderColor: c => c.p1.parsed.y < 0 ? '#dc2626' : '#16a34a' }, pointBackgroundColor: ms.map(x => x.result < 0 ? '#dc2626' : '#16a34a') }
      ]
    },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } }, scales: { y: { ticks: moneyTick, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
  }));
  const parts = [['Custo das mercadorias', F.cmv, '#b9846c'], ['Taxas maquininha/Pix', F.fees, '#e3c2a8'], ['Despesas da loja', F.expenses, '#8e4a5e'], ['Lucro', Math.max(0, F.result), '#16a34a']].filter(x => x[1] > 0);
  if (F.net > 0 && parts.length) {
    charts.push(new Chart($('#chFinWhere'), {
      type: 'doughnut',
      data: { labels: parts.map(x => x[0]), datasets: [{ data: parts.map(x => round2(x[1])), backgroundColor: parts.map(x => x[2]), borderWidth: 2, borderColor: '#fff' }] },
      options: { maintainAspectRatio: false, cutout: '58%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.parsed)} (${pctOf(c.parsed, F.net)} das vendas)` } } } }
    }));
  } else $('#chFinWhere').parentElement.innerHTML = '<div class="chart-msg">Sem vendas no período.</div>';
}

/* ---------- Contas a pagar / a receber ---------- */
function renderBills(type) {
  const isP = type === 'pagar';
  const st = adminState.billFilter = adminState.billFilter || 'open';
  const q = norm(adminState.billSearch || '');
  const t = todayISO();
  const all = DB.bills.filter(b => b.type === type);
  const who = b => isP ? (getSupplier(b.supplierId) || {}).name || '' : (b.customer ? b.customer.name : '');
  const list = all.filter(b => {
    const s = billStatus(b);
    if (st === 'open' && !(s === 'aberta' || s === 'vencida')) return false;
    if (st === 'late' && s !== 'vencida') return false;
    if (st === 'paid' && s !== 'paga') return false;
    if (st !== 'all' && s === 'cancelada') return false;
    return !q || norm(b.desc + ' ' + b.category + ' ' + who(b)).includes(q);
  }).sort((a, b) => st === 'paid' ? (b.paidAt || '').localeCompare(a.paidAt || '') : a.due.localeCompare(b.due));
  const open = all.filter(b => b.status !== 'cancelada' && !b.paidAt);
  const sum = l => round2(l.reduce((a, b) => a + billValue(b), 0));
  const late = open.filter(b => b.due < t), soon = open.filter(b => b.due >= t && b.due <= addDaysISO(t, 7));
  const paidMonth = all.filter(b => b.status !== 'cancelada' && b.paidAt && b.paidAt >= monthStartISO(t));
  const stBadge = b => ({ paga: `<span class="badge b-green">${isP ? 'Paga' : 'Recebida'} ${fmtISO(b.paidAt).slice(0, 5)}</span>`, vencida: '<span class="badge b-red">Vencida</span>', aberta: b.due === t ? '<span class="badge b-amber">Vence hoje</span>' : '<span class="badge b-blue">Em aberto</span>', cancelada: '<span class="badge b-gray">Cancelada</span>' })[billStatus(b)];
  const recs = DB.recurring.filter(r => (r.type || 'pagar') === type && r.active !== false);

  $('#finBody').innerHTML = `
    <div class="cash-grid">
      <div class="stat ${late.length ? 'bad' : ''}"><div class="l">${isP ? 'Vencidas' : 'Atrasadas'}</div><div class="v">${fmt(sum(late))}</div><div class="hint">${late.length} conta(s)</div></div>
      <div class="stat"><div class="l">Vencem em 7 dias</div><div class="v">${fmt(sum(soon))}</div><div class="hint">${soon.length} conta(s)</div></div>
      <div class="stat"><div class="l">Total em aberto</div><div class="v">${fmt(sum(open))}</div><div class="hint">${open.length} conta(s)</div></div>
      <div class="stat hl"><div class="l">${isP ? 'Pago' : 'Recebido'} este mês</div><div class="v">${fmt(sum(paidMonth))}</div><div class="hint">${paidMonth.length} conta(s)</div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <input class="input search" id="billSearch" placeholder="🔍 Buscar por descrição, categoria ou ${isP ? 'fornecedor' : 'cliente'}..." value="${esc(adminState.billSearch || '')}">
        <div class="seg" id="billSt">${[['open', 'Em aberto'], ['late', isP ? 'Vencidas' : 'Atrasadas'], ['paid', isP ? 'Pagas' : 'Recebidas'], ['all', 'Todas']].map(([k, l]) => `<button data-s="${k}" class="${k === st ? 'active' : ''}">${l}</button>`).join('')}</div>
        <button class="btn btn-primary" id="btnNewBill">＋ ${isP ? 'Nova conta a pagar' : 'Nova conta a receber'}</button>
        <button class="btn btn-sm" id="billCsv">⬇️ Excel</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th>${isP ? 'Fornecedor' : 'Cliente'}</th><th class="r">Valor</th><th class="c">Situação</th><th class="r">Ações</th></tr></thead>
        <tbody>${list.length ? list.map(b => `<tr class="${billStatus(b) === 'vencida' ? 'row-late' : ''}">
          <td class="mono" style="white-space:nowrap">${fmtISO(b.due)}</td>
          <td><b>${esc(b.desc)}</b>${b.recurringId ? ' <span class="badge b-pink" title="Conta fixa mensal">🔁 mensal</span>' : ''}${b.purchaseId ? ' <span class="badge b-gray">🚚 compra</span>' : ''}${b.saleId ? ' <span class="badge b-gray">🧾 venda</span>' : ''}${b.notes ? `<div class="hint">${esc(b.notes)}</div>` : ''}</td>
          <td><span class="badge b-gray">${esc(b.category)}</span></td>
          <td>${esc(who(b)) || '<span class="hint">—</span>'}${!isP && b.customer && b.customer.phone ? `<div class="hint">${fmtPhone(b.customer.phone)}</div>` : ''}</td>
          <td class="r mono"><b>${fmt(billValue(b))}</b>${b.paidAt && b.paidAmount !== undefined && b.paidAmount !== b.amount ? `<div class="hint">original ${fmt(b.amount)}</div>` : ''}</td>
          <td class="c">${stBadge(b)}</td>
          <td><div class="actions">
            ${b.status !== 'cancelada' && !b.paidAt ? `<button class="btn btn-sm btn-success" data-bpay="${b.id}">✔ ${isP ? 'Pagar' : 'Receber'}</button>` : ''}
            ${b.paidAt ? `<button class="icon-btn" title="Desfazer ${isP ? 'pagamento' : 'recebimento'}" data-bundo="${b.id}">↩️</button>` : ''}
            ${!isP && !b.paidAt && b.customer && b.customer.phone && b.status !== 'cancelada' ? `<a class="icon-btn" title="Lembrar o cliente no WhatsApp" target="_blank" rel="noopener" href="${waLink(b.customer.phone, `Olá ${firstName(b.customer.name)}! Aqui é da ${DB.settings.storeName} 💖 Passando para lembrar da parcela de ${fmt(b.amount)} com vencimento em ${fmtISO(b.due)}. Qualquer dúvida estamos à disposição!`)}">💬</a>` : ''}
            <button class="icon-btn" title="Editar" data-bedit="${b.id}">✏️</button>
            <button class="icon-btn" title="Excluir" data-bdel="${b.id}">🗑️</button></div></td></tr>`).join('')
      : `<tr><td colspan="7" class="empty-row">${st === 'open' ? (isP ? 'Nenhuma conta a pagar em aberto. 🎉' : 'Nada a receber em aberto.') : 'Nenhuma conta encontrada.'}</td></tr>`}</tbody>
      </table></div>
    </div>
    ${isP || recs.length ? `<div class="card"><h3>🔁 Contas fixas mensais</h3>
      ${recs.length ? `<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th class="c">Todo dia</th><th class="r">Valor</th><th>Desde</th><th>Até</th><th class="r">Ações</th></tr></thead><tbody>
        ${recs.map(r => `<tr><td><b>${esc(r.desc)}</b></td><td><span class="badge b-gray">${esc(r.category)}</span></td><td class="c mono">${Number(r.start.slice(8))}</td><td class="r mono">${fmt(r.amount)}</td><td>${monthLabel(r.start)}</td><td>${r.end ? monthLabel(r.end) : 'sem fim'}</td>
          <td><div class="actions"><button class="icon-btn" title="Mudar valor ou descrição" data-redit="${r.id}">✏️</button><button class="btn btn-sm" data-rstop="${r.id}">⏹ Encerrar</button></div></td></tr>`).join('')}</tbody></table></div>`
        : '<p class="hint">Nenhuma conta fixa. Ao cadastrar uma conta, escolha "Repetir todo mês" para aluguel, luz, internet, salário... Ela aparece sozinha todo mês.</p>'}</div>` : ''}`;

  $('#billSt').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { adminState.billFilter = b.dataset.s; renderAdmin(); } });
  $('#billSearch').addEventListener('input', debounce(e => { adminState.billSearch = e.target.value; renderAdmin(); setTimeout(() => { const i = $('#billSearch'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); }, 300));
  $('#btnNewBill').addEventListener('click', () => openBillModal(null, type));
  $('#billCsv').addEventListener('click', () => {
    const rows = [['Tipo', 'Vencimento', 'Descrição', 'Categoria', isP ? 'Fornecedor' : 'Cliente', 'Valor', 'Situação', 'Pago em', 'Forma']];
    all.forEach(b => rows.push([isP ? 'A pagar' : 'A receber', fmtISO(b.due), b.desc, b.category, who(b), billValue(b), billStatus(b), b.paidAt ? fmtISO(b.paidAt) : '', b.paidMethod ? BILL_METHODS[b.paidMethod] || b.paidMethod : '']));
    downloadFile(`contas_${type}_${stamp()}.csv`, toCSV(rows), 'text/csv;charset=utf-8');
  });
  const byId = id => DB.bills.find(b => b.id === id);
  $$('[data-bpay]').forEach(b => b.addEventListener('click', () => openPayBillModal(byId(b.dataset.bpay))));
  $$('[data-bedit]').forEach(b => b.addEventListener('click', () => openBillModal(byId(b.dataset.bedit), type)));
  $$('[data-bundo]').forEach(b => b.addEventListener('click', () => {
    const bill = byId(b.dataset.bundo);
    confirmModal(`Desfazer o ${isP ? 'pagamento' : 'recebimento'} de <b>${esc(bill.desc)}</b>? A conta volta a ficar em aberto.`, () => {
      const ok = undoCashMove(bill.cashRef);
      bill.paidAt = null; delete bill.paidAmount; delete bill.paidMethod; delete bill.cashRef; bill.updatedAt = new Date().toISOString();
      saveDB(); renderAdmin(); toast(ok ? 'Pronto, a conta voltou para em aberto.' : 'Conta reaberta. O caixa daquele dia já foi fechado, então o lançamento no caixa ficou como estava.', ok ? 'success' : 'warn', 5000);
    }, { title: 'Desfazer', yesText: 'Desfazer' });
  }));
  $$('[data-bdel]').forEach(b => b.addEventListener('click', () => {
    const bill = byId(b.dataset.bdel);
    confirmModal(`Excluir a conta <b>${esc(bill.desc)}</b> de ${fmt(billValue(bill))}?${bill.recurringId ? '<br><br>É de uma conta fixa mensal: só este mês será excluído. Para parar de vez, use "Encerrar" na lista de contas fixas.' : ''}${bill.saleId ? '<br><br>Ela veio de uma venda a prazo (fiado). A venda continua registrada.' : ''}`, () => {
      undoCashMove(bill.cashRef);
      DB.bills = DB.bills.filter(x => x.id !== bill.id); DB.deleted.push(bill.id);
      saveDB(); renderAdmin(); toast('Conta excluída.', 'warn');
    }, { title: 'Excluir conta', yesText: 'Excluir', danger: true });
  }));
  $$('[data-redit]').forEach(b => b.addEventListener('click', () => openRecurringEdit(DB.recurring.find(r => r.id === b.dataset.redit))));
  $$('[data-rstop]').forEach(b => b.addEventListener('click', () => {
    const r = DB.recurring.find(x => x.id === b.dataset.rstop);
    confirmModal(`Encerrar a conta fixa <b>${esc(r.desc)}</b>?<br><br>As contas já pagas continuam no histórico. As que ainda não venceram e não foram pagas serão removidas.`, () => {
      const t = todayISO();
      r.active = false; r.end = t; r.updatedAt = new Date().toISOString();
      DB.bills.filter(x => x.recurringId === r.id && !x.paidAt && x.due > t).forEach(x => { DB.deleted.push(x.id); });
      DB.bills = DB.bills.filter(x => !(x.recurringId === r.id && !x.paidAt && x.due > t));
      saveDB(); renderAdmin(); toast('Conta fixa encerrada.', 'info');
    }, { title: 'Encerrar conta fixa', yesText: 'Encerrar', danger: true });
  }));
}
function openRecurringEdit(r) {
  openModal({
    title: '🔁 Conta fixa mensal',
    body: `<div class="field"><label>Descrição</label><input class="input" id="reDesc" value="${esc(r.desc)}"></div>
      <div class="grid-2"><div class="field"><label>Valor (R$)</label><input class="input" id="reAmount" inputmode="decimal" value="${fmtNum(r.amount)}"></div>

        ${isP ? `<div class="field"><label>Fornecedor (opcional)</label><select class="select" id="bSup"><option value="">— nenhum —</option>${DB.suppliers.slice().sort((a, c) => a.name.localeCompare(c.name)).map(s => `<option value="${s.id}" ${s.id === b.supplierId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`
        : `<div class="field"><label>Cliente (opcional)</label><div id="bCust"></div></div>`}
      </div>
      ${isNew ? `<div class="field"><label>Repetição</label>
        <div class="seg" id="bRep"><button data-r="once" class="active">Só uma vez</button><button data-r="parc">Parcelado</button><button data-r="month">🔁 Repetir todo mês</button></div>
        <div id="bRepBox" style="margin-top:8px"></div></div>` : ''}
      <div class="field"><label>Observação</label><input class="input" id="bNotes" value="${esc(b.notes || '')}" placeholder="Opcional"></div>
      ${isNew ? `<label class="check"><input type="checkbox" id="bPaidNow"> Já foi ${isP ? 'paga' : 'recebida'} hoje</label>` : ''}`,
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="bOk">💾 Salvar</button>`,
    onOpen: m => {
      if (!isP) customerWidget($('#bCust', m), () => custId, id => { custId = id; });
      let rep = 'once';
      const repBox = () => {
        const box = $('#bRepBox', m); if (!box) return;
        $$('#bRep button', m).forEach(x => x.classList.toggle('active', x.dataset.r === rep));
        box.innerHTML = rep === 'parc' ? `<div class="grid-2"><div class="field"><label>Número de parcelas</label><select class="select" id="bParc">${Array.from({ length: 23 }, (_, i) => i + 2).map(n => `<option>${n}</option>`).join('')}</select></div>
            <div class="field"><label>O valor informado é</label><select class="select" id="bParcMode"><option value="total">O total (divide nas parcelas)</option><option value="each">De cada parcela</option></select></div></div><p class="hint">Uma parcela por mês, a partir do vencimento escolhido.</p>`
          : rep === 'month' ? `<div class="grid-2"><div class="field"><label>Até quando?</label><select class="select" id="bMonths"><option value="0">Sem data para acabar</option>${[3, 6, 12, 24, 36].map(n => `<option value="${n}">Por ${n} meses</option>`).join('')}</select></div></div><p class="hint">A conta aparece sozinha todo mês, no mesmo dia do vencimento. Dá para mudar o valor ou encerrar quando quiser.</p>` : '';
      };
      if ($('#bRep', m)) $('#bRep', m).addEventListener('click', e => { const x = e.target.closest('[data-r]'); if (x) { e.preventDefault(); rep = x.dataset.r; repBox(); } });
      $('#bOk', m).addEventListener('click', () => {
        const desc = $('#bDesc').value.trim(), amount = parseMoney($('#bAmount').value), due = $('#bDue').value;
        if (!desc) { toast('Informe a descrição.', 'error'); $('#bDesc').focus(); return; }
        if (!(amount > 0)) { toast('Informe o valor.', 'error'); $('#bAmount').focus(); return; }
        if (!due) { toast('Informe o vencimento.', 'error'); return; }
        const common = { type: b.type, category: $('#bCat').value, notes: $('#bNotes').value.trim(), supplierId: isP ? ($('#bSup').value || null) : null, customer: !isP && custId ? custSnap(custId) : null };
        const now = new Date().toISOString();
        if (!isNew) {
          const real = DB.bills.find(x => x.id === b.id);
          Object.assign(real, common, { desc, amount: real.paidAt ? real.amount : amount, due, updatedAt: now });
          if (real.paidAt && amount !== real.paidAmount) real.paidAmount = amount;
          saveDB(); closeModal(); renderAdmin(); toast('Conta atualizada.', 'success'); return;
        }
        const created = [];
        if (rep === 'month') {
          const months = Number($('#bMonths').value);
          const r = { id: uid(), type: b.type, desc, category: common.category, amount, start: due, end: months ? addMonthsISO(due, months - 1) : null, supplierId: common.supplierId, active: true, createdAt: now, updatedAt: now };
          DB.recurring.push(r); ensureRecurring();
          created.push(...DB.bills.filter(x => x.recurringId === r.id));
        } else if (rep === 'parc') {
          const n = Number($('#bParc').value), each = $('#bParcMode').value === 'each';
          const parts = each ? Array(n).fill(amount) : splitAmount(amount, n);
          parts.forEach((v, i) => created.push(newBill({ ...common, desc: `${desc} • ${i + 1}/${n}`, amount: v, due: addMonthsISO(due, i), parcel: `${i + 1}/${n}` })));
        } else created.push(newBill({ ...common, desc, amount, due }));
        if ($('#bPaidNow').checked) { const first = created.sort((a, c) => a.due.localeCompare(c.due))[0]; Object.assign(first, { paidAt: todayISO(), paidAmount: first.amount, paidMethod: 'pix', updatedAt: now }); }
        saveDB(); closeModal(); renderAdmin();
        toast(rep === 'month' ? 'Conta fixa criada! Ela vai aparecer todo mês.' : created.length > 1 ? `${created.length} parcelas criadas.` : 'Conta cadastrada.', 'success');
      });
    }
  });
}

      $('#pbMethod').addEventListener('change', syncCash); syncCash();

        Object.assign(b, { paidAt: date, paidAmount: round2(amount), paidMethod: method, cashRef, updatedAt: new Date().toISOString(), paidBy: currentUser ? (currentUser.name || currentUser.username) : '' });

}

    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-primary id="sfOk">💾 Salvar</button>`,
    onOpen: m => $('#sfOk', m).addEventListener('click', () => {
      const name = $('#sfName').value.trim();
      if (!name) { toast('Informe o nome do fornecedor.', 'error'); return; }
      saved = saveSupplier({ name, doc: $('#sfDoc').value.trim(), contact: $('#sfContact').value.trim(), phone: $('#sfPhone').value.replace(/\D/g, ''), email: $('#sfEmail').value.trim(), notes: $('#sfNotes').value.trim() }, isNew ? null : s);
      saveDB(); closeModal();
      if (!after) { renderAdmin(); toast('Fornecedor salvo!', 'success'); }
    })
  });
}
function openSupplierHistory(s) {
  const pus = DB.purchases.filter(p => p.supplierId === s.id).sort((a, b) => b.date.localeCompare(a.date));
  const bills = DB.bills.filter(b => b.supplierId === s.id && !b.paidAt && b.status !== 'cancelada').sort((a, b) => a.due.localeCompare(b.due));
  const prodQty = {}; pus.filter(p => p.status !== 'cancelada').forEach(p => p.items.forEach(i => { const k = prodQty[i.name] = prodQty[i.name] || { qty: 0, last: 0 }; k.qty += i.qty; k.last = k.last || i.cost; }));
  openModal({
    title: `🚚 ${esc(s.name)}`, size: 'xl',
    body: `<div class="cash-grid">
        <div class="stat"><div class="l">Compras</div><div class="v">${pus.filter(p => p.status !== 'cancelada').length}</div></div>
        <div class="stat"><div class="l">Total comprado</div><div class="v">${fmt(pus.filter(p => p.status !== 'cancelada').reduce((a, p) => a + p.total, 0))}</div></div>
        <div class="stat"><div class="l">Em aberto</div><div class="v">${fmt(bills.reduce((a, b) => a + b.amount, 0))}</div></div>
        <div class="stat hl"><div class="l">Telefone</div><div class="v" style="font-size:16px">${s.phone ? fmtPhone(s.phone) : '—'}</div></div>
      </div>
      ${bills.length ? `<h3 style="margin:6px 0 8px;font-size:15px">📤 Parcelas em aberto</h3>${bills.map(b => `<div class="alert-item ${b.due < todayISO() ? 'zero' : ''}" style="margin-bottom:6px"><span class="em">📄</span><div class="info"><div class="nm">${esc(b.desc)}</div><div class="meta">vence ${fmtISO(b.due)}</div></div><b class="mono">${fmt(b.amount)}</b></div>`).join('')}` : ''}
      <h3 style="margin:14px 0 8px;font-size:15px">🧾 Histórico de compras</h3>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Nota</th><th>Produtos</th><th class="r">Total</th><th class="c">Status</th></tr></thead><tbody>
      ${pus.length ? pus.map(p => `<tr><td class="mono">${fmtISO(p.date)}</td><td class="mono">${esc(p.invoice || '—')}</td><td>${p.items.map(i => `${i.qty}x ${esc(i.name)} (${fmt(i.cost)})`).join(', ')}</td><td class="r mono">${fmt(p.total)}</td><td class="c">${p.status === 'cancelada' ? '<span class="badge b-gray">Cancelada</span>' : '<span class="badge b-green">OK</span>'}</td></tr>`).join('') : '<tr><td colspan="5" class="empty-row">Nenhuma compra ainda.</td></tr>'}
      </tbody></table></div>
      ${Object.keys(prodQty).length ? `<p class="hint" style="margin-top:10px">📦 Produtos que você compra dele: ${Object.entries(prodQty).sort((a, b) => b[1].qty - a[1].qty).map(([n, v]) => `${esc(n)} (${v.qty} un.)`).join(', ')}</p>` : ''}`,
    footer: `<button class="btn" id="shNew">＋ Nova compra deste fornecedor</button><button class="btn btn-primary" data-primary data-close>Fechar</button>`,
    onOpen: m => $('#shNew', m).addEventListener('click', () => { closeModal(); openPurchaseModal({ supplierId: s.id }); })
  });
}
/* Nova entrada de compra */
function openPurchaseModal(init = {}) {
  const st = Object.assign({ supplierId: '', date: todayISO(), invoice: '', items: [], freight: 0, discount: 0, payMode: 'avista', method: 'pix', installments: 1, firstDue: addDaysISO(todayISO(), 30), updateCost: true, fromCash: false }, init);
  const cash = currentCash();
  const body = () => {
    const base = st.items.reduce((a, i) => a + i.qty * i.cost, 0), total = round2(base + st.freight - st.discount);
    return `<div class="grid-3">
        <div class="field"><label>Fornecedor</label><select class="select" id="puSup"><option value="">— sem fornecedor —</option>${DB.suppliers.slice().sort((a, b) => a.name.localeCompare(b.name)).map(s => `<option value="${s.id}" ${s.id === st.supplierId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}<option value="__new">＋ Cadastrar novo…</option></select></div>
        <div class="field"><label>Data da entrada</label><input class="input" type="date" id="puDate" value="${st.date}"></div>
        <div class="field"><label>Nº da nota (opcional)</label><input class="input" id="puInv" value="${esc(st.invoice)}" placeholder="Ex.: 12345"></div>
      </div>
      <div class="field" style="position:relative"><label>Adicionar produto</label><input class="input" id="puFind" placeholder="🔍 Bipe o código de barras ou digite o nome / SKU e tecle Enter" autocomplete="off"><div id="puRes" class="pu-res hidden"></div></div>
      <div class="table-wrap" style="margin-bottom:10px"><table class="pu-items"><thead><tr><th>Produto</th><th class="c">Estoque atual</th><th class="r">Custo atual</th><th class="c" style="width:90px">Qtd</th><th style="width:120px">Custo unit. (R$)</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>
        ${st.items.length ? st.items.map((it, i) => { const p = getProduct(it.pid) || {}; return `<tr><td>${p.emoji || ''} <b>${esc(p.name || it.name)}</b><div class="hint">${esc(prodCodeLabel(p))}</div></td><td class="c">${p.stock ?? '—'}</td><td class="r mono">${fmt(p.cost)}</td>
          <td><input class="input" type="number" min="1" step="1" data-pq="${i}" value="${it.qty}" style="text-align:center"></td><td><input class="input" inputmode="decimal" data-pc="${i}" value="${fmtNum(it.cost)}"></td>
          <td class="r mono">${fmt(it.qty * it.cost)}</td><td><button class="icon-btn" data-prm="${i}" title="Tirar">🗑️</button></td></tr>`; }).join('')
        : '<tr><td colspan="7" class="empty-row" style="padding:18px">Nenhum produto ainda. Use a busca acima. (Produto novo? Cadastre antes em Produtos.)</td></tr>'}
      </tbody></table></div>
      <div class="grid-3">
        <div class="field"><label>Frete (R$)</label><input class="input" id="puFreight" inputmode="decimal" value="${st.freight ? fmtNum(st.freight) : ''}" placeholder="0,00"></div>
        <div class="field"><label>Desconto na nota (R$)</label><input class="input" id="puDisc" inputmode="decimal" value="${st.discount ? fmtNum(st.discount) : ''}" placeholder="0,00"></div>
        <div class="field"><label>Total da compra</label><div class="pu-total mono" id="puTotal">${fmt(total)}</div></div>
      </div>
      <div class="field"><label>Pagamento</label><div class="seg" id="puPay"><button data-m="avista" class="${st.payMode === 'avista' ? 'active' : ''}">À vista (já paguei)</button><button data-m="prazo" class="${st.payMode === 'prazo' ? 'active' : ''}">A prazo / boleto</button></div></div>
      ${st.payMode === 'avista' ? `<div class="grid-2"><div class="field"><label>Forma</label><select class="select" id="puMethod">${Object.entries(BILL_METHODS).map(([k, l]) => `<option value="${k}" ${k === st.method ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field" style="align-self:end">${cash && st.method === 'dinheiro' ? `<label class="check"><input type="checkbox" id="puFromCash" ${st.fromCash ? 'checked' : ''}> Paguei com dinheiro da gaveta (sangria)</label>` : ''}</div></div>`
      : `<div class="grid-2"><div class="field"><label>Parcelas</label><select class="select" id="puInst">${Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === st.installments ? 'selected' : ''}>${n}x de ${fmt(total / n)}</option>`).join('')}</select></div>
          <div class="field"><label>1º vencimento</label><input class="input" type="date" id="puDue" value="${st.firstDue}"></div></div><p class="hint" style="margin-top:-6px">As parcelas vão para Financeiro → Contas a pagar, uma por mês.</p>`}
      <label class="check"><input type="checkbox" id="puCost" ${st.updateCost ? 'checked' : ''}> Atualizar o preço de custo dos produtos (custo médio, já com frete e desconto)</label>`;
  };
  const read = m => {
    if (!$('#puSup', m)) return;
    st.supplierId = $('#puSup').value === '__new' ? '' : $('#puSup').value; st.date = $('#puDate').value || todayISO(); st.invoice = $('#puInv').value.trim();
    st.freight = parseMoney($('#puFreight').value); st.discount = parseMoney($('#puDisc').value); st.updateCost = $('#puCost').checked;
    $$('[data-pq]', m).forEach(x => { st.items[+x.dataset.pq].qty = Math.max(1, parseInt(x.value, 10) || 1); });
    $$('[data-pc]', m).forEach(x => { st.items[+x.dataset.pc].cost = parseMoney(x.value); });
    if ($('#puMethod')) st.method = $('#puMethod').value;
    if ($('#puFromCash')) st.fromCash = $('#puFromCash').checked;
    if ($('#puInst')) { st.installments = Number($('#puInst').value); st.firstDue = $('#puDue').value || st.firstDue; }
  };
  const addProd = p => {
    const ex = st.items.find(i => i.pid === p.id);
    if (ex) ex.qty++; else st.items.push({ pid: p.id, name: p.name, qty: 1, cost: p.cost });
  };
  let modalM;
  const readAll = () => read(modalM);
  const redraw = focusFind => { $('.modal-body', modalM).innerHTML = body(); bind(); if (focusFind) setTimeout(() => $('#puFind').focus(), 10); };
  const updTotal = () => { readAll(); const base = st.items.reduce((a, i) => a + i.qty * i.cost, 0); $('#puTotal').textContent = fmt(base + st.freight - st.discount); };
  function bind() {
    const m = modalM;
    $('#puFind').addEventListener('input', e => {
      const t = norm(e.target.value), box = $('#puRes');
      if (!t) { box.classList.add('hidden'); return; }
      const res = DB.products.filter(p => norm(p.name + ' ' + (p.sku || '') + ' ' + (p.code || '')).includes(t)).slice(0, 7);
      box.innerHTML = res.length ? res.map(p => `<button data-pp="${p.id}">${p.emoji || ''} <b>${esc(p.name)}</b> <span class="hint">${esc(prodCodeLabel(p))} • estoque ${p.stock} • custo ${fmt(p.cost)}</span></button>`).join('') : '<div class="hint" style="padding:8px">Nenhum produto encontrado.</div>';
      box.classList.remove('hidden');
    });
    $('#puRes').addEventListener('click', e => { const b = e.target.closest('[data-pp]'); if (b) { readAll(); addProd(getProduct(b.dataset.pp)); redraw(true); } });
    $$('[data-prm]', m).forEach(b => b.addEventListener('click', () => { readAll(); st.items.splice(+b.dataset.prm, 1); redraw(); }));
    $$('[data-pq],[data-pc],#puFreight,#puDisc', m).forEach(x => x.addEventListener('change', () => { readAll(); redraw(); }));
    $$('[data-pq],[data-pc],#puFreight,#puDisc', m).forEach(x => x.addEventListener('input', updTotal));
    $('#puPay').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { e.preventDefault(); readAll(); st.payMode = b.dataset.m; redraw(); } });
    if ($('#puMethod')) $('#puMethod').addEventListener('change', () => { readAll(); redraw(); });
    $('#puSup').addEventListener('change', e => {
      if (e.target.value !== '__new') return;
      readAll();
      openSupplierModal(null, s => { st.supplierId = s ? s.id : ''; openPurchaseModal(st); });
    });
  }
  openModal({
    title: '🚚 Nova entrada de compra', size: 'xl', body: body(),
    footer: `<button class="btn" data-close>Cancelar</button><button class="btn btn-success" id="puOk">✔ Dar entrada no estoque</button>`,
    onKey: e => { if (e.key === 'Enter') { const a = document.activeElement; if (a && a.id === 'puFind') { e.preventDefault(); const first = $('#puRes [data-pp]'); const p = findByCode(a.value.trim()) || (first && getProduct(first.dataset.pp)); if (p) { readAll(); addProd(p); redraw(true); } else toast('Produto não encontrado.', 'warn'); } else e.preventDefault(); } },
    onOpen: m => { modalM = m; bind(); setTimeout(() => $('#puFind').focus(), 30); }
  });
  $('#puOk').addEventListener('click', () => {
    readAll();
    if (!st.items.length) { toast('Adicione pelo menos um produto.', 'error'); return; }
    if (st.items.some(i => !(i.cost >= 0) || i.qty <= 0)) { toast('Confira as quantidades e os custos.', 'error'); return; }
    const base = st.items.reduce((a, i) => a + i.qty * i.cost, 0), extra = st.freight - st.discount, total = round2(base + extra);
    if (total < 0) { toast('O desconto é maior que o valor da compra.', 'error'); return; }
    if (st.payMode === 'avista' && st.method === 'dinheiro' && st.fromCash && cash && total > cashSummary(cash).expectedCash) { toast('Não há dinheiro suficiente na gaveta.', 'error'); return; }
    const sup = getSupplier(st.supplierId), now = new Date().toISOString();
    const pu = { id: uid(), supplierId: sup ? sup.id : null, supplierName: sup ? sup.name : '', date: st.date, invoice: st.invoice, freight: round2(st.freight), discount: round2(st.discount), total,
      payMode: st.payMode, method: st.payMode === 'avista' ? st.method : 'boleto', installments: st.payMode === 'prazo' ? st.installments : 1, status: 'ativa', updateCost: st.updateCost,
      by: currentUser ? (currentUser.name || currentUser.username) : '', createdAt: now, updatedAt: now, items: [] };
    st.items.forEach(it => {
      const p = getProduct(it.pid); if (!p) return;
      const unitReal = round2(it.cost + (base > 0 ? extra * (it.cost * it.qty / base) / it.qty : 0));
      const before = Math.max(0, p.stock), oldCost = p.cost;
      if (st.updateCost) p.cost = round2(before > 0 ? (before * oldCost + it.qty * unitReal) / (before + it.qty) : unitReal);
      stockMove(p, it.qty, 'compra', pu.id);
      pu.items.push({ pid: p.id, name: p.name, qty: it.qty, cost: round2(it.cost), unitReal, oldCost, newCost: p.cost });
    });
    DB.purchases.push(pu);
    const desc = `Compra ${pu.supplierName || 'de mercadoria'}${pu.invoice ? ' • NF ' + pu.invoice : ''}`;
    if (st.payMode === 'avista') {
      const b = newBill({ type: 'pagar', desc, category: MERCH_CAT, amount: total, due: st.date, supplierId: pu.supplierId, purchaseId: pu.id, paidAt: st.date, paidAmount: total, paidMethod: st.method });
      if (st.method === 'dinheiro' && st.fromCash && cash) b.cashRef = cashMove('sangria', total, desc);
    } else splitAmount(total, st.installments).forEach((v, i) => newBill({ type: 'pagar', desc: `${desc}${st.installments > 1 ? ` • ${i + 1}/${st.installments}` : ''}`, category: MERCH_CAT, amount: v, due: addMonthsISO(st.firstDue, i), supplierId: pu.supplierId, purchaseId: pu.id, parcel: `${i + 1}/${st.installments}` }));
    saveDB(); closeModal(); renderAdmin();
    toast(`Entrada registrada! ${pu.items.reduce((a, i) => a + i.qty, 0)} unidades somadas ao estoque.`, 'success', 4000);
  });
}
function openPurchaseDetail(p) {
  const pi = purchasePayInfo(p);
  openModal({
    title: `🚚 Compra de ${fmtISO(p.date)}`, size: 'xl',
    body: `<p style="margin-bottom:10px"><b>${esc(p.supplierName || 'Sem fornecedor')}</b>${p.invoice ? ` • Nota ${esc(p.invoice)}` : ''} • lançada por ${esc(p.by || '—')}${p.status === 'cancelada' ? ' • <span class="badge b-gray">Cancelada</span>' : ''}</p>
      <div class="table-wrap"><table><thead><tr><th>Produto</th><th class="c">Qtd</th><th class="r">Custo unit.</th><th class="r">Custo real*</th>${p.updateCost ? '<th class="r">Custo antes → depois</th>' : ''}<th class="r">Subtotal</th></tr></thead><tbody>
      ${p.items.map(i => `<tr><td>${esc(i.name)}</td><td class="c">${i.qty}</td><td class="r mono">${fmt(i.cost)}</td><td class="r mono">${fmt(i.unitReal)}</td>${p.updateCost ? `<td class="r mono">${fmt(i.oldCost)} → <b>${fmt(i.newCost)}</b></td>` : ''}<td class="r mono">${fmt(i.qty * i.cost)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint" style="margin:6px 0 10px">* custo real = custo unitário com frete${p.discount ? ' e desconto' : ''} divididos proporcionalmente.</p>
      <div class="cash-grid"><div class="stat"><div class="l">Frete</div><div class="v">${fmt(p.freight)}</div></div><div class="stat"><div class="l">Desconto</div><div class="v">${fmt(p.discount)}</div></div><div class="stat hl"><div class="l">Total</div><div class="v">${fmt(p.total)}</div></div><div class="stat"><div class="l">Em aberto</div><div class="v">${fmt(pi.openValue)}</div></div></div>
      ${pi.bills.length ? `<h3 style="margin:6px 0 8px;font-size:15px">💳 Pagamento</h3>${pi.bills.sort((a, b) => a.due.localeCompare(b.due)).map(b => `<div class="alert-item" style="margin-bottom:6px"><span class="em">${b.paidAt ? '✅' : '📄'}</span><div class="info"><div class="nm">${esc(b.desc)}</div><div class="meta">vence ${fmtISO(b.due)}${b.paidAt ? ` • pago em ${fmtISO(b.paidAt)}` : ''}</div></div><b class="mono">${fmt(billValue(b))}</b></div>`).join('')}` : ''}`,
    footer: `<button class="btn btn-primary" data-primary data-close>Fechar</button>`
  });
}
function cancelPurchase(p) {
  const pi = purchasePayInfo(p);
  const neg = p.items.filter(i => { const pr = getProduct(i.pid); return pr && pr.stock - i.qty < 0; });
  confirmModal(`Cancelar a compra de <b>${fmt(p.total)}</b> (${fmtISO(p.date)})?<br><br>• As ${p.items.reduce((a, i) => a + i.qty, 0)} unidades saem do estoque<br>• ${pi.open ? `${pi.open} parcela(s) em aberto serão canceladas` : 'Não há parcelas em aberto'}${pi.paid ? `<br>• ${pi.paid} pagamento(s) já feitos continuam registrados (exclua em Contas a pagar se quiser)` : ''}<br>• O preço de custo dos produtos não volta sozinho${neg.length ? `<br><br>⚠️ ${neg.map(i => esc(i.name)).join(', ')} ficará(ão) com estoque negativo (já foram vendidos).` : ''}`, () => {
    p.items.forEach(i => stockMove(getProduct(i.pid), -i.qty, 'compra cancelada', p.id));
    pi.bills.filter(b => !b.paidAt).forEach(b => { b.status = 'cancelada'; b.updatedAt = new Date().toISOString(); });
    p.status = 'cancelada'; p.updatedAt = new Date().toISOString();
    saveDB(); renderAdmin(); toast('Compra cancelada.', 'warn');
  }, { title: 'Cancelar compra', yesText: 'Sim, cancelar', danger: true });
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
(async function init() {
  await loadDB();
  requestPersistentStorage();
  await loadSyncCfg();
  await loadPhotos();
  if (ensureRecurring()) saveDB();
  tickClock();
  setInterval(tickClock, 1000);
  showPDV();
  updateBackupBadge();
  await dailySnapshot();
  setTimeout(checkDailyBackup, 1500);
  if (syncEnabled()) { setSyncStatus(syncCfg.pending ? (navigator.onLine ? 'pending' : 'offline') : 'ok'); syncNow(); }
  setInterval(() => { if (syncEnabled()) syncNow(); }, 30 * 1000); // sincroniza sozinho a cada 30 s (envia e recebe)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && syncEnabled()) syncNow(); });
  window.addEventListener('focus', () => { if (syncEnabled()) syncNow(); });
  setInterval(checkDailyBackup, 20 * 60 * 1000); // confere de novo a cada 20 min (ex.: loja aberta após a meia-noite)
})();
window.addEventListener('focus', focusSearch);
/* Outra aba salvou? Recarrega os dados para manter tudo sincronizado */
if (channel) channel.onmessage = async () => {
  if (!idb || saving || dirty) return;
  try { const raw = await idbGet('kv', 'db'); if (raw) { DB = normalizeDB(JSON.parse(raw)); if (!modalState) { mode === 'pdv' ? renderPDV() : renderAdmin(); } } } catch (e) { console.error(e); }
};
